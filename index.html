<style>

.chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text2);cursor:pointer}.chk input{width:18px;height:18px}

<body>
<div id="login"><div class="lbox"><h1>Site<span>Books</span></h1><p>Partnership ledger · K.D Constructions</p>
<form id="loginForm" onsubmit="doLogin();return false;" autocomplete="on">

<script>
/* ════════════════════════════════════════════════════════════
   ENGINE — pure functions, no DOM. All money is handled in PAISE
   (integers) internally so that splits never leave rounding drift.
   ════════════════════════════════════════════════════════════ */

// ---- money helpers -------------------------------------------------
function toPaise(rupees){ return Math.round(Number(rupees||0)*100); }
function toRupees(paise){ return (paise||0)/100; }

/* Split `totalPaise` across shares (percentages, must be > 0 sum).
   Uses the largest-remainder method so parts ALWAYS add up to the total exactly.
   shares: [{pid, pct}]  ->  {pid: paise} */
function splitPaise(totalPaise, shares){
  const out={};
  const list=(shares||[]).filter(s=>Number(s.pct)>0);
  const sum=list.reduce((a,s)=>a+Number(s.pct),0);
  if(!list.length||sum<=0){ return out; }
  const sign=totalPaise<0?-1:1;
  const abs=Math.abs(totalPaise);
  let used=0;
  const rows=list.map(s=>{
    const exact=abs*Number(s.pct)/sum;
    const floor=Math.floor(exact);
    used+=floor;
    return {pid:s.pid,floor,frac:exact-floor};
  });
  let rem=abs-used;
  rows.slice().sort((a,b)=>b.frac-a.frac).forEach(r=>{ if(rem>0){r.floor+=1;rem-=1;} });
  rows.forEach(r=>{ out[r.pid]=(out[r.pid]||0)+sign*r.floor; });
  return out;
}

/* Amount lines like paidBy / receivedBy: [{pid, amount(rupees)}] -> {pid: paise} */
function sumLines(lines){
  const out={};
  (lines||[]).forEach(l=>{
    const p=toPaise(l.amount);
    if(!l.pid||!p)return;
    out[l.pid]=(out[l.pid]||0)+p;
  });
  return out;
}

function pctTotal(shares){ return Math.round((shares||[]).reduce((a,s)=>a+Number(s.pct||0),0)*1000)/1000; }

/* ---- validation used by the UI and by tests -------------------- */
function validateShares(shares){
  const t=pctTotal(shares);
  if(!shares||!shares.length) return {ok:false,msg:'Add at least one partner'};
  if(shares.some(s=>Number(s.pct)<0)) return {ok:false,msg:'Percentages cannot be negative'};
  if(Math.abs(t-100)>0.001) return {ok:false,msg:'Shares total '+t+'% — must be exactly 100%'};
  return {ok:true,msg:''};
}
function validateLines(lines,totalRupees,label){
  const ls=(lines||[]).filter(l=>l.pid&&Number(l.amount)>0);
  if(!ls.length) return {ok:false,msg:label+': choose at least one partner and amount'};
  const sum=ls.reduce((a,l)=>a+toPaise(l.amount),0);
  const tot=toPaise(totalRupees);
  if(sum!==tot) return {ok:false,msg:label+' lines add to '+toRupees(sum).toLocaleString('en-IN')+' but the total is '+toRupees(tot).toLocaleString('en-IN')};
  return {ok:true,msg:''};
}

/* ════════════════════════════════════════════════════════════
   SITE POSITION
   For one site, compute each partner's:
     paidOut       – what they paid toward expenses/capital-setup
     expShare      – their share of all expenses
     revHeld       – income they physically received
     revShare      – their share of income (by PROFIT ratio)
     settledOut    – settlement money they paid to others
     settledIn     – settlement money they received from others
     net           – positive => partnership owes THEM; negative => THEY owe
   The settlement is:  net = (paidOut - expShare) + (revShare - revHeld) + settledOut - settledIn
   Intuition: money they put in beyond their share is owed back; revenue they are
   holding beyond their share of it must be handed over.
   ════════════════════════════════════════════════════════════ */
function computeSite(site, expenses, incomes, settlements, opts){
  opts=opts||{};
  const from=opts.from||'', to=opts.to||'';
  const inRange=d=>(!from||d>=from)&&(!to||d<=to);
  const pids=(site.partners||[]).map(p=>p.pid);
  const P={};
  pids.forEach(pid=>{ P[pid]={pid,paidOut:0,expShare:0,revHeld:0,revShare:0,settledOut:0,settledIn:0,capitalIn:0,capitalHeld:0,overrideShare:0,net:0}; });
  const ensure=pid=>{ if(!P[pid])P[pid]={pid,paidOut:0,expShare:0,revHeld:0,revShare:0,settledOut:0,settledIn:0,capitalIn:0,capitalHeld:0,overrideShare:0,net:0,removed:true}; return P[pid]; };

  let totalOverrideExp=0, totalExp=0, totalRunExp=0, totalSetupExp=0, totalInc=0, totalCapital=0, totalRefund=0;
  const byCategory={}, byMonth={};
  const mon=d=>(d||'').slice(0,7);
  const bump=(m,k,v)=>{ if(!m)return; byMonth[m]=byMonth[m]||{month:m,exp:0,inc:0,runExp:0,setupExp:0}; byMonth[m][k]+=v; };

  (expenses||[]).filter(e=>!e.deleted&&inRange(e.date)).forEach(e=>{
    const amt=toPaise(e.amount);
    totalExp+=amt;
    if(e.kind==='setup') totalSetupExp+=amt; else totalRunExp+=amt;
    const cat=(e.category||'Uncategorised');
    byCategory[cat]=(byCategory[cat]||0)+amt;
    bump(mon(e.date),'exp',amt);
    bump(mon(e.date),e.kind==='setup'?'setupExp':'runExp',amt);
    // who paid
    const paid=sumLines(e.paidBy);
    Object.keys(paid).forEach(pid=>{ ensure(pid).paidOut+=paid[pid]; });
    // who bears it — the split STORED ON THE ENTRY (so later site-split edits never rewrite history)
    // Resolution order:  explicit per-entry override  >  split stamped when the entry was saved  >  site's current split.
    // The stamp is what keeps history stable when someone later edits the site's percentages.
    const overridden=!!(e.split&&e.split.length);
    const shares=overridden?e.split:((e.stampedSplit&&e.stampedSplit.length)?e.stampedSplit:(site.expenseSplit||[]));
    const parts=splitPaise(amt,shares);
    Object.keys(parts).forEach(pid=>{ ensure(pid).expShare+=parts[pid]; });
    if(overridden){
      // settled on its own terms, outside the pooled profit calculation
      totalOverrideExp+=amt;
      Object.keys(parts).forEach(pid=>{ ensure(pid).overrideShare=(P[pid].overrideShare||0)+parts[pid]; });
    }
  });

  (incomes||[]).filter(i=>!i.deleted&&inRange(i.date)).forEach(i=>{
    const amt=toPaise(i.amount);
    const held=sumLines(i.receivedBy);
    if(i.kind==='capital'){
      /* A capital contribution is money one partner hands over to be held by another (or by the
         partner who is running the site). It is NOT income and NOT profit.
         Modelled as a transfer:  contributedBy (paid in)  ->  receivedBy (now holds it).
         The holder is now holding partnership money, so they owe it back; the contributor is owed it. */
      totalCapital+=amt;
      const gave=sumLines(i.contributedBy);
      Object.keys(gave).forEach(pid=>{ ensure(pid).capitalIn+=gave[pid]; });
      Object.keys(held).forEach(pid=>{ ensure(pid).capitalHeld=(P[pid].capitalHeld||0)+held[pid]; });
      return;
    }
    if(i.kind==='refund'){
      // deposit refund received: reduces cost, is partnership money held by receiver
      totalRefund+=amt;
    } else {
      totalInc+=amt;
      bump(mon(i.date),'inc',amt);
    }
    Object.keys(held).forEach(pid=>{ ensure(pid).revHeld+=held[pid]; });
    // Rule A only ("separate"): each income entry is shared by the profit ratio on its own.
    if(site.profitRule==='separate'){
      const shares=(i.split&&i.split.length)?i.split:(site.profitSplit||[]);
      const parts=splitPaise(amt,shares);
      Object.keys(parts).forEach(pid=>{ ensure(pid).revShare+=parts[pid]; });
    }
  });

  (settlements||[]).filter(s=>!s.deleted&&inRange(s.date)).forEach(s=>{
    const amt=toPaise(s.amount);
    if(s.from) ensure(s.from).settledOut+=amt;
    if(s.to)   ensure(s.to).settledIn+=amt;
  });

  // Net of refunds counts against expenses for profit purposes
  const netExpenses=totalExp-totalRefund;
  const profit=totalInc-netExpenses;                       // headline profit (all costs)
  // For the pooled rule, costs carrying an explicit per-entry split are borne by exactly those people,
  // so the amount left to share by the profit ratio is income − refunds' effect − NON-overridden costs.
  const poolProfit=totalInc-(totalExp-totalOverrideExp-totalRefund);
  const poolParts=splitPaise(poolProfit,site.profitSplit||[]);
  const profitParts=splitPaise(profit,site.profitSplit||[]);   // shown on reports

  /* Two ways to settle, chosen per site (site.profitRule):
     'pooled'   (DEFAULT, Rule B): pool costs against income, then share the PROFIT by the profit ratio.
                entitlement = profit share.
     'separate' (Rule A): costs follow the expense ratio, income follows the profit ratio.
                entitlement = revShare(income by profit ratio) − expShare(costs by expense ratio).
     In both, cashNow is what the partner has physically paid out / is holding:
                cashNow = revHeld + refunds held − paidOut − capitalIn      (capital is returned to them)
     and  net = entitlement − cashNow  (+ settlements already made).
     When expense ratio == profit ratio the two rules give identical numbers. */
  Object.values(P).forEach(p=>{
    // capital: what they handed over is owed back to them; what they now hold is owed to others
    const cashNow=p.revHeld-p.paidOut-p.capitalIn+p.capitalHeld;
    let entitled;
    if(site.profitRule==='separate'){ entitled=p.revShare-p.expShare; }
    else { entitled=(poolParts[p.pid]||0)-(p.overrideShare||0); p.revShare=poolParts[p.pid]||0; }
    p.entitled=entitled;
    p.net=(entitled-cashNow)+p.settledOut-p.settledIn;
  });

  return {
    partners:P, totalExp, totalRunExp, totalSetupExp, totalInc, totalCapital, totalRefund,
    netExpenses, profit,
    runningProfit: totalInc-(totalRunExp-0), // before setup/one-time costs
    profitParts, byCategory, byMonth:Object.values(byMonth).sort((a,b)=>a.month.localeCompare(b.month))
  };
}

/* Minimum-transfers settlement.
   Input: {pid: netPaise}  (positive = is owed, negative = owes). Must sum to ~0.
   Greedy: repeatedly match the largest debtor with the largest creditor.
   Returns [{from,to,amount(paise)}].  */
function settleUp(netByPid){
  const cred=[], debt=[];
  Object.keys(netByPid).forEach(pid=>{
    const v=netByPid[pid];
    if(v>0)cred.push({pid,v}); else if(v<0)debt.push({pid,v:-v});
  });
  const out=[];
  cred.sort((a,b)=>b.v-a.v); debt.sort((a,b)=>b.v-a.v);
  let i=0,j=0;
  while(i<cred.length&&j<debt.length){
    const x=Math.min(cred[i].v,debt[j].v);
    if(x>0) out.push({from:debt[j].pid,to:cred[i].pid,amount:x});
    cred[i].v-=x; debt[j].v-=x;
    if(cred[i].v===0)i++;
    if(debt[j].v===0)j++;
  }
  return out;
}

/* Overall position across MANY sites: sums each partner's net and settles once */
function computeOverall(sites, expByS, incByS, setByS, opts){
  const per=[]; const tot={}; let totalExp=0,totalInc=0,profit=0,totalCapital=0;
  const byMonth={};
  sites.forEach(s=>{
    const r=computeSite(s,expByS[s.id]||[],incByS[s.id]||[],setByS[s.id]||[],opts);
    per.push({site:s,res:r});
    totalExp+=r.totalExp; totalInc+=r.totalInc; profit+=r.profit; totalCapital+=r.totalCapital;
    Object.values(r.partners).forEach(p=>{ tot[p.pid]=(tot[p.pid]||0)+p.net; });
    r.byMonth.forEach(m=>{
      const b=byMonth[m.month]=byMonth[m.month]||{month:m.month,exp:0,inc:0,runExp:0,setupExp:0};
      b.exp+=m.exp;b.inc+=m.inc;b.runExp+=m.runExp;b.setupExp+=m.setupExp;
    });
  });
  return {per,netByPid:tot,transfers:settleUp(tot),totalExp,totalInc,profit,totalCapital,
          byMonth:Object.values(byMonth).sort((a,b)=>a.month.localeCompare(b.month))};
}


/* ════════════════════════════════════════════════════════════
   STORE — one Firestore document per record.
   Collection layout (all under  sitebooks_<kind>/<id>):
     sitebooks_partners   sitebooks_sites   sitebooks_expenses
     sitebooks_incomes    sitebooks_settlements   sitebooks_log
   Why per-record: with 3 people entering money at the same time, a single
   shared blob means "last save wins" and silently drops someone's entry.
   Here two people adding different entries never touch the same document.
   Edits to the SAME record use optimistic concurrency (rev number).
   Works with plain fetch (REST) — no SDK, matching the rest of your apps.
   ════════════════════════════════════════════════════════════ */

/* ---- Firestore value encoding ---- */
function fsEnc(v){
  if(v===null||v===undefined) return {nullValue:null};
  if(typeof v==='boolean') return {booleanValue:v};
  if(typeof v==='number')  return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
  if(typeof v==='string')  return {stringValue:v};
  if(Array.isArray(v))     return {arrayValue:{values:v.map(fsEnc)}};
  if(typeof v==='object')  return {mapValue:{fields:Object.fromEntries(Object.entries(v).filter(([,x])=>x!==undefined).map(([k,x])=>[k,fsEnc(x)]))}};
  return {stringValue:String(v)};
}
function fsDec(v){
  if(!v) return null;
  if('nullValue' in v) return null;
  if('booleanValue' in v) return v.booleanValue;
  if('integerValue' in v) return Number(v.integerValue);
  if('doubleValue' in v) return v.doubleValue;
  if('stringValue' in v) return v.stringValue;
  if('arrayValue' in v) return (v.arrayValue.values||[]).map(fsDec);
  if('mapValue' in v) return Object.fromEntries(Object.entries(v.mapValue.fields||{}).map(([k,x])=>[k,fsDec(x)]));
  return null;
}
const docToObj=d=>{ const o=Object.fromEntries(Object.entries(d.fields||{}).map(([k,v])=>[k,fsDec(v)])); return o; };
const objToDoc=o=>({fields:Object.fromEntries(Object.entries(o).filter(([,x])=>x!==undefined).map(([k,v])=>[k,fsEnc(v)]))});

const QUEUE_KEY='sitebooks_queue_v1';

const qSave=()=>{ try{localStorage.setItem(QUEUE_KEY,JSON.stringify(queue));}catch(e){} };

let syncState='synced';           // 'synced' | 'saving' | 'error'
let onSyncChange=()=>{};

/* ---- low level REST ---- */
async function fsList(kind){
  let out=[], token='';
  do{
    const url=`${FB_BASE}/${COLL(kind)}?key=${FB_KEY}&pageSize=300${token?'&pageToken='+encodeURIComponent(token):''}`;
    const r=await fetch(url,{cache:'no-store'});
    if(r.status===404) return [];          // collection doesn't exist yet
    if(!r.ok) throw new Error('list '+kind+' '+r.status);
    const j=await r.json();
    (j.documents||[]).forEach(d=>{ const o=docToObj(d); o.id=d.name.split('/').pop(); out.push(o); });
    token=j.nextPageToken||'';
  }while(token);
  return out;
}
async function fsGet(kind,id){
  const r=await fetch(`${FB_BASE}/${COLL(kind)}/${id}?key=${FB_KEY}`,{cache:'no-store'});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('get '+r.status);
  const d=await r.json(); const o=docToObj(d); o.id=id; return o;
}
async function fsSet(kind,obj){
  const {id,...rest}=obj;
  const r=await fetch(`${FB_BASE}/${COLL(kind)}/${id}?key=${FB_KEY}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(objToDoc(rest))});
  if(!r.ok) throw new Error('set '+kind+' '+r.status);
}

/* ---- local record helpers ---- */
const listOf=k=>DB[k];
function findLocal(kind,id){ return DB[kind].find(x=>x.id===id); }
function upsertLocal(kind,obj){
  const i=DB[kind].findIndex(x=>x.id===obj.id);
  if(i>=0) DB[kind][i]=obj; else DB[kind].push(obj);
}

/* Save a record: write locally at once (UI stays instant), queue the network write. */
function saveRecord(kind,obj,who){
  const now=Date.now();
  const existing=findLocal(kind,obj.id);
  const rec={...obj};
  if(!rec.id) rec.id=uid();
  rec.rev=(existing?.rev||0)+1;
  rec.updatedAt=now; rec.updatedBy=who||'';
  if(!existing){ rec.createdAt=now; rec.createdBy=who||''; } else { rec.createdAt=existing.createdAt; rec.createdBy=existing.createdBy; }
  upsertLocal(kind,rec); cacheSave();
  queue=queue.filter(q=>!(q.kind===kind&&q.id===rec.id));   // newest version replaces older queued one
  queue.push({kind,id:rec.id,baseRev:existing?.rev||0});
  qSave(); flushQueue();
  return rec;
}
/* Soft delete — records are never physically removed, so a mistake is recoverable and the log stays honest */
function deleteRecord(kind,id,who){
  const e=findLocal(kind,id); if(!e) return;
  return saveRecord(kind,{...e,deleted:true,deletedAt:Date.now(),deletedBy:who||''},who);
}

let flushPromise=null, flushAgain=false;
/* Returns the in-flight flush so callers can await the REAL work. If more items are queued while a
   flush is running, it loops again rather than returning early and leaving them stranded.

   IMPORTANT: the async body can finish synchronously (e.g. called with an empty queue). The promise is therefore
   cleared from a .then() that runs AFTER the assignment below — never from a `finally` inside the body, which
   would run first and then be overwritten, leaving a dead promise installed forever. */
async function _flushBody(){
  do{
    flushAgain=false;
    while(queue.length){
      const q=queue[0]; const local=findLocal(q.kind,q.id);
      if(!local){ queue.shift(); qSave(); continue; }
      setSync('saving');
      try{
        // optimistic concurrency: if someone else changed this record since we loaded it, do not blindly overwrite
        const remote=await fsGet(q.kind,q.id);
        if(remote && (remote.rev||0)>q.baseRev){
          // conflict: keep the server's version, tell the user, never silently lose either side
          upsertLocal(q.kind,remote); cacheSave();
          queue.shift(); qSave();
          if(typeof onConflict==='function') onConflict(q.kind,local,remote);
          continue;
        }
        await fsSet(q.kind,local);
        queue.shift(); qSave();
      }catch(e){
        setSync('error');
        setTimeout(flushQueue,8000);       // retry later; queue is persisted so nothing is lost
        return;
      }
    }
  }while(flushAgain);
  setSync('synced');
}
function flushQueue(){
  if(flushPromise){ flushAgain=true; return flushPromise; }
  const p=_flushBody().catch(e=>{ setSync('error'); });
  flushPromise=p;
  p.then(()=>{ if(flushPromise===p) flushPromise=null; });
  return p;
}
let onConflict=null;
function setConflictHandler(fn){ onConflict=fn; }

/* Pull everything from the server and merge. A locally-queued (unsent) record always wins over the
   server copy so we never clobber a pending edit with stale data. */
let lastPull=0;
async function pullAll(){
  try{
    const pending=new Set(queue.map(q=>q.kind+':'+q.id));
    for(const k of KINDS){
      const remote=await fsList(k);
      const remoteIds=new Set(remote.map(r=>r.id));
      remote.forEach(r=>{ if(!pending.has(k+':'+r.id)) upsertLocal(k,r); });
      // records we have locally that the server doesn't and aren't pending: leave (could be mid-write)
    }
    cacheSave(); lastPull=Date.now();
    if(!queue.length) setSync('synced');
    return true;
  }catch(e){ setSync('error'); return false; }
}

  try{ if(queue.length) await Promise.race([flushQueue(), new Promise(r=>setTimeout(r,5000))]); }catch(e){}
  if(queue.length&&!confirm(queue.length+' entr'+(queue.length===1?'y is':'ies are')+' not sent yet (no internet). They stay saved on this phone and go out next time you sign in here. Log out anyway?'))return;
  _auth=null; _authSave();
  try{sessionStorage.removeItem('sb_user');}catch(e){}
  location.reload();
}
function bootApp(){
  $('login').style.display='none'; $('app').style.display='flex'; $('who').textContent=ME.name;
  cacheLoad(); render();
  // Only seed founders after a SUCCESSFUL pull: if we're offline with an empty cache we must not write blank
  // founder records over ones a partner has since filled in with phone / PAN / address.
  pullAll().then(okPull=>{ if(okPull) ensureSelfPartner(); render(); setTimeout(plCheckDue,800); setTimeout(sbDriveRun,6000); });
  if(!bootApp._drvTimer) bootApp._drvTimer=setInterval(()=>{ if(!document.hidden) sbDriveRun(); },300000);
  flushQueue();
}
/* The three logins ARE the founding partners. They get FIXED ids, so if all three phones open the app for the
   first time at the same instant they each write the same three documents (identical content) instead of each
   inventing their own set. Only written when a founding partner is missing from the loaded data. */
const FOUNDERS=USERS.map(u=>({id:'p_'+u.name.toLowerCase(),name:u.name}));
function ensureSelfPartner(){
  FOUNDERS.forEach(f=>{
    const exists=DB.partners.some(p=>p.id===f.id);
    if(!exists) saveRecord('partners',{id:f.id,name:f.name,phone:'',email:'',pan:'',address:'',login:f.name},ME.name);
  });
}

/* Split editor: rows of partner + percent. Used for both expense split and profit split. */
function splitEditorHTML(prefix,shares,partnerIds){
  const rows=partnerIds.map(pid=>{
    const s=(shares||[]).find(x=>x.pid===pid); const v=s?s.pct:'';
    return `<div class="split-row"><span class="split-name">${esc(pname(pid))}</span><input class="form-input split-in" type="number" step="0.01" min="0" inputmode="decimal" id="${prefix}_${pid}" value="${v}" oninput="updSplitTotal('${prefix}')"><span class="pct">%</span></div>`;
  }).join('');
  return `<div id="${prefix}_box">${rows}<div class="split-total" id="${prefix}_tot"></div></div>`;
}
function readSplit(prefix,partnerIds){ return partnerIds.map(pid=>({pid,pct:Number($(prefix+'_'+pid)?.value||0)})); }
function updSplitTotal(prefix){
  const box=$(prefix+'_box'); if(!box) return;
  const ids=[...box.querySelectorAll('input')].map(i=>i.id.slice(prefix.length+1));
  const t=pctTotal(readSplit(prefix,ids)); const el=$(prefix+'_tot'); if(!el) return;
  const good=Math.abs(t-100)<0.001;
  el.className='split-total '+(good?'ok':'bad'); el.textContent='Total: '+t+'%'+(good?' ✓':' — must be 100%');
}
function equalSplit(prefix){
  const box=$(prefix+'_box'); const ins=[...box.querySelectorAll('input')]; const n=ins.length; if(!n)return;
  let left=10000; ins.forEach((inp,i)=>{ const v=i===n-1?left:Math.floor(10000/n); inp.value=(v/100).toString(); left-=v; }); updSplitTotal(prefix);
}

/* ---- expense form ---- */
let _payLines=[], _recvLines=[], _contribLines=[];
function linesEditorHTML(prefix,lines,partnerIds){
  return `<div id="${prefix}_box">`+lines.map((l,i)=>`<div class="split-row"><select class="form-select" id="${prefix}_p${i}" style="flex:1.4">${partnerIds.map(pid=>`<option value="${pid}" ${l.pid===pid?'selected':''}>${esc(pname(pid))}</option>`).join('')}</select><input class="form-input" type="number" step="0.01" inputmode="decimal" id="${prefix}_a${i}" value="${l.amount||''}" placeholder="₹" style="flex:1" oninput="lineTotals('${prefix}')">${lines.length>1?`<button class="mini-btn del" onclick="removeLine('${prefix}',${i})">✕</button>`:''}</div>`).join('')+`</div><button class="mini-btn edit" onclick="addLine('${prefix}')" style="margin-top:4px">+ another partner</button><div class="split-total" id="${prefix}_tot"></div>`;
}
function readLines(prefix,n){ const out=[]; for(let i=0;i<n;i++){ const p=$(prefix+'_p'+i), a=$(prefix+'_a'+i); if(p&&a) out.push({pid:p.value,amount:Number(a.value||0)}); } return out; }
function _lineArr(prefix){ return prefix==='pay'?_payLines:prefix==='rcv'?_recvLines:_contribLines; }
function _setLineArr(prefix,v){ if(prefix==='pay')_payLines=v; else if(prefix==='rcv')_recvLines=v; else _contribLines=v; }
function addLine(prefix){ const cur=readLines(prefix,_lineArr(prefix).length); const ids=(siteById(_formSite)?.partners||[]).map(p=>p.pid); const used=cur.map(l=>l.pid); const next=ids.find(i=>!used.includes(i))||ids[0]; cur.push({pid:next,amount:''}); _setLineArr(prefix,cur); refreshLines(prefix); }
function removeLine(prefix,i){ const cur=readLines(prefix,_lineArr(prefix).length); cur.splice(i,1); _setLineArr(prefix,cur); refreshLines(prefix); }
function refreshLines(prefix){ const ids=(siteById(_formSite)?.partners||[]).map(p=>p.pid); const box=$(prefix+'_wrap'); if(box){ box.innerHTML=linesEditorHTML(prefix,_lineArr(prefix),ids); lineTotals(prefix); } }
function lineTotals(prefix){
  const el=$(prefix+'_tot'); if(!el) return;
  const tot=Number($('f_amount')?.value||0); const lines=readLines(prefix,_lineArr(prefix).length);
  const sum=lines.reduce((a,l)=>a+toPaise(l.amount),0); const need=toPaise(tot);
  const good=sum===need&&need>0;
  el.className='split-total '+(good?'ok':'bad');

function compressImage(file,maxW,q){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(maxW/img.width,maxW/img.height,1); const c=document.createElement('canvas'); c.width=img.width*k; c.height=img.height*k; c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); }; img.onerror=rej; img.src=e.target.result; }; r.onerror=rej; r.readAsDataURL(file); }); }

/* Excel export with Urban Haven branding; setup costs optionally excluded from P&L figures.
   Partner cash columns (paid out, collected, net) always use ALL expenses — that's real money owed. */
function exportReportXLSX(sites,from,to,noSetup,label,fname){
  if(!window.XLSX){ alert('Excel library did not load. Check your internet connection and try again.'); return; }
  const exOf=sid=>noSetup?expensesOf(sid).filter(e=>e.kind!=='setup'):expensesOf(sid);
  const inR=d=>(!from||d>=from)&&(!to||d<=to);
  const wb=XLSX.utils.book_new();
  const head=[[BRAND],['Profit & Loss Report'],['Period',label||'All time'],['Sites',sites.length>1?'All sites ('+sites.length+')':sites[0].name],['One-time setup costs',noSetup?'Excluded':'Included'],['Generated',fmtDate(todayStr())+' by '+ME.name],[]];
  const _b=bookingBreakdown(sites.map(x=>x.id),from,to);
  if(_b.withBk) head.splice(head.length-1,0,['Bookings: guest paid',_b.gross/100],['Airbnb / platform fees',_b.fee/100],['TDS deducted',_b.tds/100],['Net booking income in hand',_b.net/100]);
  const summary=head.concat([['Site','Income (net in hand)','Expenses','Setup cost','Profit / Loss']]);
  let ti=0,te=0,ts=0;
  sites.forEach(s=>{ const r=computeSite(s,exOf(s.id),incomesOf(s.id),settlementsOf(s.id),{from,to}); const full=computeSite(s,expensesOf(s.id),incomesOf(s.id),settlementsOf(s.id),{from,to});
    summary.push([s.name,r.totalInc/100,r.totalExp/100,noSetup?'excluded ('+full.totalSetupExp/100+')':r.totalSetupExp/100,r.profit/100]); ti+=r.totalInc;te+=r.totalExp;ts+=r.totalSetupExp; });
  if(sites.length>1) summary.push(['TOTAL',ti/100,te/100,noSetup?'excluded':ts/100,(ti-te)/100]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(summary),'Summary');
  const ledger=[[BRAND+' — Ledger · '+(label||'All time')],[],['Site','Date','Type','Category / Source','Vendor','Note','Amount','Paid / Received by','Custom split']];
  const rows=[];
  sites.forEach(s=>{
    exOf(s.id).filter(e=>inR(e.date)).forEach(e=>rows.push([s.name,e.date,e.kind==='setup'?'Setup expense':'Expense',e.category||'',e.vendor||'',e.note||'',e.amount,(e.paidBy||[]).map(l=>pname(l.pid)+' '+l.amount).join(' + '),e.split&&e.split.length?e.split.map(x=>pname(x.pid)+' '+x.pct+'%').join(', '):'']));
    incomesOf(s.id).filter(e=>inR(e.date)).forEach(e=>rows.push([s.name,e.date,e.kind==='capital'?'Capital':e.kind==='refund'?'Refund':'Income',e.source||'','',e.note||'',e.amount,(e.receivedBy||[]).map(l=>pname(l.pid)+' '+l.amount).join(' + '),'']));
    settlementsOf(s.id).filter(e=>inR(e.date)).forEach(e=>rows.push([s.name,e.date,'Settlement','','',e.note||'',e.amount,pname(e.from)+' → '+pname(e.to),'']));
  });
  rows.sort((a,b)=>String(a[1]).localeCompare(String(b[1])));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ledger.concat(rows)),'Ledger');
  const months=[[BRAND+' — Month by month'],[],['Month','Income','Expenses','Profit / Loss']];
  const eb={},ib={},sb={}; sites.forEach(s=>{eb[s.id]=exOf(s.id);ib[s.id]=incomesOf(s.id);sb[s.id]=settlementsOf(s.id);});
  computeOverall(sites,eb,ib,sb,{from,to}).byMonth.forEach(m=>months.push([monthLabel(m.month),m.inc/100,m.exp/100,(m.inc-m.exp)/100]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(months),'Monthly');
  const pt=[[BRAND+' — Partners'],[],['Site','Partner','Paid out','Collected','Profit share','Net (+ is owed)']];
  sites.forEach(s=>{ const r=computeSite(s,exOf(s.id),incomesOf(s.id),settlementsOf(s.id),{from,to}); const full=computeSite(s,expensesOf(s.id),incomesOf(s.id),settlementsOf(s.id),{from,to});
    Object.values(full.partners).forEach(p=>pt.push([s.name,pname(p.pid),p.paidOut/100,p.revHeld/100,(r.profitParts[p.pid]||0)/100,p.net/100])); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(pt),'Partners');
  const bk=[[BRAND+' — Bookings · '+(label||'All time')],[],['Site','Date','Guest','Check-in','Check-out','Nights','Confirmation code','Source','Guest paid / gross','Airbnb fee','TDS','Other deductions','Net in hand','Received by']];
  let bt={g:0,f:0,t:0,o:0,n:0};
  sites.forEach(s=>incomesOf(s.id).filter(i=>(i.kind||'booking')==='booking'&&inR(i.date)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(i=>{ const b=bkOf(i);
    bk.push([s.name,i.date,i.guestName||'',i.checkIn||'',i.checkOut||'',i.nights||'',i.confCode||'',i.source||'',b.gross/100,b.fee/100,b.tds/100,b.other/100,b.net/100,(i.receivedBy||[]).map(l=>pname(l.pid)).join(' + ')]);
    bt.g+=b.gross;bt.f+=b.fee;bt.t+=b.tds;bt.o+=b.other;bt.n+=b.net; }));
  bk.push(['TOTAL','','','','','','','',bt.g/100,bt.f/100,bt.t/100,bt.o/100,bt.n/100,'']);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(bk),'Bookings');
  XLSX.writeFile(wb,fname||('UrbanHaven_Report_'+todayStr()+'.xlsx'));
}

  h+=`<div class="btn-row"><button class="site-btn share" onclick="openSendReport({scope:'all',period:'year',year:REP_YEAR})">📤 Send ${REP_YEAR} report</button><button class="site-btn pay" onclick="openSendReport({scope:'all',period:'month'})">📤 Send a month</button></div>`;

/* ════════════ PARTNER P&L — partner-wise income & expense for a month / date range ════════════
   For each partner, across every site they are on:
     Income share  = their profit-ratio share of booking income (per-entry split if one was set)
     Expense share = their share of costs (per-entry override / stamped split, same as the settlement engine)
     Profit share  = the engine's profit share for the site (what the reports & settlement use)
     Paid out      = money they personally paid toward expenses
     Collected     = income that landed in their hands                                   */
let PP_MODE='month', PP_MONTH=monthStr(), PP_FROM='', PP_TO='', PP_ONLY=true;
function ppRange(){
  if(PP_MODE==='month') return {from:PP_MONTH+'-01',to:PP_MONTH+'-31',label:monthLabel(PP_MONTH)};
  if(PP_MODE==='range') return {from:PP_FROM,to:PP_TO,label:(PP_FROM?fmtDate(PP_FROM):'Start')+' → '+(PP_TO?fmtDate(PP_TO):'Today')};
  return {from:'',to:'',label:'All time'};
}
function ppShiftMonth(d){ const [y,m]=PP_MONTH.split('-').map(Number); const dt=new Date(y,m-1+d,1); PP_MONTH=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); render(); }
/* One partner's numbers on one site for a date range */
function partnerSiteFigures(site,pid,from,to){
  const inR=d=>(!from||d>=from)&&(!to||d<=to);
  const r=computeSite(site,repExpOf(site.id),incomesOf(site.id),settlementsOf(site.id),{from,to});
  const rf=REP_NO_SETUP?computeSite(site,expensesOf(site.id),incomesOf(site.id),settlementsOf(site.id),{from,to}):r;
  const p=r.partners[pid], pf=rf.partners[pid]; if(!p||!pf) return null;
  let incShare=0;
  incomesOf(site.id).filter(i=>i.kind!=='capital'&&i.kind!=='refund'&&inR(i.date)).forEach(i=>{
    const shares=(i.split&&i.split.length)?i.split:(site.profitSplit||[]);
    incShare+=splitPaise(toPaise(i.amount),shares)[pid]||0;
  });
  const profitPct=((site.profitSplit||[]).find(x=>x.pid===pid)||{}).pct||0;
  return {site,res:r,incShare,expShare:p.expShare,profitShare:r.profitParts[pid]||0,paidOut:pf.paidOut,collected:pf.revHeld,net:pf.net,profitPct};
}
function partnerFigures(pid,from,to){

/* Every entry in the range that touched this partner — what they paid / received */
function partnerEntries(pid,from,to){
  const inR=d=>(!from||d>=from)&&(!to||d<=to);
  const mySites=new Set(siteList().filter(s=>(s.partners||[]).some(x=>x.pid===pid)).map(s=>s.id));
  const out=[];
  DB.expenses.filter(e=>!e.deleted&&mySites.has(e.siteId)&&inR(e.date)&&!(REP_NO_SETUP&&e.kind==='setup')).forEach(e=>{
    const mine=sumLines(e.paidBy)[pid]||0;
    out.push({date:e.date,site:e.siteId,type:'exp',text:e.note||e.category||'Expense',cat:e.category||'Uncategorised',total:toPaise(e.amount),mine});
  });
  DB.incomes.filter(i=>!i.deleted&&mySites.has(i.siteId)&&inR(i.date)).forEach(i=>{
    const mine=sumLines(i.receivedBy)[pid]||0;
    out.push({date:i.date,site:i.siteId,type:i.kind==='capital'?'cap':i.kind==='refund'?'ref':'inc',text:i.note||i.source||(i.kind==='capital'?'Partner capital':i.kind==='refund'?'Refund':'Booking'),total:toPaise(i.amount),mine});

/* ════════════ BOOKING BREAKDOWN — guest paid · Airbnb fee · TDS · net in hand ════════════
   An income entry's `amount` is ALWAYS the net money in hand (that's what settlements use, unchanged).
   Optional fields on booking entries: gross (guest paid / booking value), platformFee, tds, otherDed.
   Entries without a breakdown count as gross = net, no fee, no TDS. */
function bkOf(i){
  const net=toPaise(i.amount);
  if(i.gross==null||i.gross===''){ return {gross:net,fee:0,tds:0,other:0,net,has:false}; }
  const gross=toPaise(i.gross), fee=toPaise(i.platformFee||0), tds=toPaise(i.tds||0);
  return {gross,fee,tds,other:gross-fee-tds-net,net,has:true};
}
function bookingBreakdown(siteIds,from,to){
  const inR=d=>(!from||d>=from)&&(!to||d<=to);
  const ids=new Set(siteIds);
  const t={gross:0,fee:0,tds:0,other:0,net:0,count:0,withBk:0};
  DB.incomes.filter(i=>!i.deleted&&ids.has(i.siteId)&&inR(i.date)&&(i.kind||'booking')==='booking').forEach(i=>{
    const b=bkOf(i); t.gross+=b.gross;t.fee+=b.fee;t.tds+=b.tds;t.other+=b.other;t.net+=b.net;t.count++; if(b.has)t.withBk++;
  });
  return t;
}
function bookingBreakdownHTML(siteIds,from,to){
  const b=bookingBreakdown(siteIds,from,to);
  if(!b.withBk) return '';
  return `<div class="sec-hdr">Booking income breakdown</div><div class="card">
    <div class="kv"><span>Guest paid / gross (${b.count} booking${b.count>1?'s':''})</span><b>${inr(b.gross)}</b></div>
    <div class="kv"><span>Airbnb / platform fees</span><b class="r">−${inr(b.fee)}</b></div>
    <div class="kv"><span>TDS deducted</span><b class="r">−${inr(b.tds)}</b></div>
    ${b.other?`<div class="kv"><span>Other deductions / adjustments</span><b class="${b.other>0?'r':'g'}">${b.other>0?'−'+inr(b.other):'+'+inr(-b.other)}</b></div>`:''}
    <div class="kv total"><span>Net in hand</span><b class="g">${inr(b.net)}</b></div>
    ${b.tds?`<div class="muted" style="margin-top:6px">TDS of ${inr(b.tds)} should appear in Form 26AS / AIS and can be claimed when filing returns.</div>`:''}
    ${b.withBk<b.count?`<div class="muted" style="margin-top:4px">${b.count-b.withBk} entr${b.count-b.withBk>1?'ies have':'y has'} no breakdown — counted as gross = net.</div>`:''}
  </div>`;
}

function readBkForm(amount){
  if(!$('f_gross')) return {};

/* ════════════ AIRBNB CSV IMPORT ════════════
   Airbnb → Earnings → Transaction history → Download CSV (one file per Airbnb account).
   Rows are grouped by confirmation code: the reservation row + any tax / adjustment rows for it become ONE entry.
   "Payout" rows are bank transfers (sums of reservations) and are skipped.
   Every raw row is fingerprinted, so re-uploading an overlapping CSV never double-counts. */
const CSV_FIELDS=[
  ['date','Transaction date',/^date$|transaction date|^posted/i,true],
  ['type','Type',/^type$|transaction type/i,true],
  ['code','Confirmation code',/confirmation/i,false],
  ['listing','Listing',/^listing|property|listing name/i,true],
  ['guest','Guest',/^guest/i,false],
  ['start','Check-in / start date',/start date|check.?in|arriv(?!ing by)/i,false],
  ['end','Check-out / end date',/end date|check.?out|depart/i,false],
  ['nights','Nights',/^nights?$/i,false],
  ['amount','Amount (net to you)',/^amount$|^net|amount \(/i,true],
  ['gross','Gross earnings',/gross/i,false],
  ['fee','Service fee (host fee)',/service fee|host fee|commission/i,false],
  ['tds','Tax withheld / TDS',/tds|withh|tax withheld|income tax/i,false]
];
let CSV={rows:[],headers:[],map:{},dateFmt:'auto',tdsBefore:false,fileName:'',listingSite:{},sitePayout:{},useCheckin:false,step:'pick',sel:{}};
function parseCSV(text){
  const rows=[]; let row=[],f='',q=false;
  text=text.replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); f=''; if(row.some(x=>x.trim()!=='')) rows.push(row); row=[]; }
    else f+=c;
  }

function csvNum(v){

function csvDate(v,fmt){

  if(m){ let a=+m[1],b=+m[2],y=m[3].length===2?'20'+m[3]:m[3];
    const dmy=fmt==='dmy'?true:fmt==='mdy'?false:CSV._autoDmy;
    const d=dmy?a:b, mo=dmy?b:a; return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }

function openCsvImport(){

function csvPicked(inp){
  const f=inp.files[0]; if(!f) return;

  r.onload=e=>{
    const all=parseCSV(e.target.result);
    // header = first row that matches at least 3 known columns
    let hi=0; for(let i=0;i<Math.min(all.length,10);i++){ const hits=CSV_FIELDS.filter(([,,re])=>all[i].some(h=>re.test(h.trim()))).length; if(hits>=3){hi=i;break;} }
    CSV.headers=(all[hi]||[]).map(h=>h.trim()); CSV.rows=all.slice(hi+1).filter(r=>r.length>1); CSV.fileName=f.name;
    if(!CSV.rows.length){ toast('No rows found in this file'); return; }
    let saved={}; try{ saved=JSON.parse(localStorage.getItem('sb_csvmap')||'{}'); }catch(_){}
    CSV_FIELDS.forEach(([k,,re])=>{
      const sv=saved[k]; if(sv&&CSV.headers.includes(sv)){ CSV.map[k]=sv; return; }
      CSV.map[k]=CSV.headers.find(h=>re.test(h))||'';

function csvRowKey(r){ return [csvCol(r,'date'),csvCol(r,'type'),csvCol(r,'code'),csvCol(r,'amount'),csvCol(r,'listing'),csvCol(r,'guest')].join('|').toLowerCase(); }
function csvBuild(){

  listings.forEach(l=>{ if(CSV.listingSite[l]!==undefined) return; const s=siteList().find(s=>(s.airbnbListings||[]).some(x=>x.toLowerCase()===l.toLowerCase())); CSV.listingSite[l]=s?s.id:''; });

function csvImport(){

  if(!items.length){ toast('Nothing selected'); return; }
  const usedSites=[...new Set(items.map(i=>CSV.listingSite[i.listing||'(no listing)']))];
  for(const sid of usedSites){ if(!CSV.sitePayout[sid]){ toast('Choose who receives Airbnb payouts for '+siteById(sid).name); return; } }
  // remember listing names + payout partner on each site
  const bySite={}; Object.entries(CSV.listingSite).forEach(([l,sid])=>{ if(sid&&l!=='(no listing)') (bySite[sid]=bySite[sid]||[]).push(l); });
  usedSites.concat(Object.keys(bySite)).forEach(sid=>{ const s=siteById(sid); if(!s) return;
    const names=[...new Set([...(s.airbnbListings||[]),...(bySite[sid]||[])])];
    const pay=CSV.sitePayout[sid]||s.airbnbPayoutPid||'';
    if(JSON.stringify(names)!==JSON.stringify(s.airbnbListings||[])||pay!==(s.airbnbPayoutPid||'')) saveRecord('sites',{...s,airbnbListings:names,airbnbPayoutPid:pay},ME.name);
  });

  items.forEach(i=>{
    const sid=CSV.listingSite[i.listing||'(no listing)']; const s=siteById(sid); const pid=CSV.sitePayout[sid];
    const note=[i.guest,i.nights?i.nights+' night'+(i.nights>1?'s':''):'',i.code].filter(Boolean).join(' · ')||(i.type||'Airbnb');
    if(i.net>0){
      saveRecord('incomes',{id:uid(),siteId:sid,date:i.date,amount:i.net,kind:'booking',source:'Airbnb',receivedBy:[{pid,amount:i.net}],note,
        guestName:i.guest,confCode:i.code,checkIn:i.checkIn,checkOut:i.checkOut,nights:i.nights,gross:i.gross,platformFee:i.fee,tds:i.tds,
        importRows:i.keys,importedFrom:'airbnb-csv',importFile:CSV.fileName},ME.name); ni++; sum+=i.net;
    } else {
      const amt=Math.abs(i.net);
      saveRecord('expenses',{id:uid(),siteId:sid,date:i.date,amount:amt,category:'Airbnb adjustment',vendor:'Airbnb',kind:'run',paidBy:[{pid,amount:amt}],
        note:(i.type||'Adjustment')+(note?' · '+note:''),split:null,stampedSplit:(s.expenseSplit||[]).map(z=>({pid:z.pid,pct:z.pct})),receipt:'',

  closeModal(); render(); toast('✅ Imported '+ni+' booking'+(ni!==1?'s':'')+(ne?' + '+ne+' adjustment'+(ne!==1?'s':''):''),3500);
}


/* ════════════ GOOGLE DRIVE COPY ════════════
   Same Drive script and account as RentDesk (tenantupload@gmail.com). Settings live in sitebooks_config/drive,
   so once Kanwar connects, every partner's phone uses them.
   • once a day a full backup (every entry, receipt photos included) → SiteBooks / Backups / <year>
   • every receipt photo as a picture → SiteBooks / Receipts / <site> */
const SB_DRV=`${FB_BASE}/sitebooks_config/drive`;
let _sbd=null,_sbdBusy=false,_sbdErr='',_sbdLast=0,_sbdVer=0;
try{_sbdLast=+localStorage.getItem('sb_drive_last')||0;}catch(e){}
async function sbdLoad(){
  const r=await fetch(`${SB_DRV}?key=${FB_KEY}`,{cache:'no-store'});
  if(r.status===404){ _sbd={done:{}}; return _sbd; }
  if(!r.ok) throw new Error('Drive settings '+r.status);
  const o=docToObj(await r.json());
  _sbd={url:o.url||'',key:o.key||'',lastDaily:o.lastDaily||'',done:o.done||{}}; return _sbd;
}
async function _sbdSet(fields){
  const body={fields:{}}, mask=[];
  Object.entries(fields).forEach(([k,v])=>{
    if(k.indexOf('done.')===0){ body.fields.done=body.fields.done||{mapValue:{fields:{}}}; body.fields.done.mapValue.fields[k.slice(5)]={booleanValue:true}; }
    else body.fields[k]={stringValue:String(v)};
    mask.push(k);
  });
  const r=await fetch(`${SB_DRV}?key=${FB_KEY}`+mask.map(m=>'&updateMask.fieldPaths='+encodeURIComponent(m)).join(''),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('Drive settings save '+r.status);
}
const sbDriveOn=()=>!!(_sbd&&_sbd.url&&_sbd.key);
async function _sbdPost(body){
  const r=await fetch(_sbd.url,{method:'POST',body:JSON.stringify({...body,key:_sbd.key})});
  const j=await r.json().catch(()=>({ok:false,error:'Drive did not answer'}));
  if(!j.ok) throw new Error(j.error||'Drive error');
  return j;
}
function _sbB64(str){ const bytes=new TextEncoder().encode(str); let bin=''; for(let i=0;i<bytes.length;i+=8192) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192)); return btoa(bin); }

function _sbdReceiptJobs(){

  return active('expenses').filter(e=>e.receipt&&String(e.receipt).indexOf('data:')===0&&!done[_rcKey(e)]);
}
function backupData(){
  const data={app:'SiteBooks',version:1,exportedAt:new Date().toISOString(),exportedBy:ME?ME.name:'',counts:Object.fromEntries(KINDS.map(k=>[k,DB[k].length]))};
  KINDS.forEach(k=>{ data[k]=DB[k]; });

}
async function _sbdDaily(){
  const today=todayStr();
  if(_sbd.lastDaily===today) return;
  await pullAll();                                   // back up the latest shared data, not just this phone's copy
  await _sbdSet({lastDaily:today}); _sbd.lastDaily=today;   // claim today first so two phones don't both send
  const stamp=today+' '+new Date().toTimeString().slice(0,5).replace(':','.');
  try{ await _sbdPost({action:'backup',folder:'SiteBooks/Backups',year:today.slice(0,4),fileName:'SiteBooks backup '+stamp+'.json',data:'data:application/json;base64,'+_sbB64(JSON.stringify(backupData()))}); }
  catch(e){ try{ await _sbdSet({lastDaily:''}); _sbd.lastDaily=''; }catch(x){} throw e; }
}
async function sbDriveRun(){
  if(_sbdBusy||!ME||!navigator.onLine) return;
  _sbdBusy=true; let sent=0;
  try{
    await sbdLoad(); if(!sbDriveOn()) return;
    if(!(_sbdVer>=2)){ const pj=await _sbdPost({action:'ping'}); _sbdVer=Number(pj.version||1); if(_sbdVer<2) throw new Error('Update the Drive script first (new version with app folders) — nothing is lost, it waits'); }
    await _sbdDaily();
    for(const e of _sbdReceiptJobs().slice(0,15)){
      const s=siteById(e.siteId), what=(e.category||e.vendor||e.note||'Expense').slice(0,40);
      await _sbdPost({action:'file',root:'SiteBooks',tenant:{tkey:'sb_'+e.siteId,site:'Receipts',folderName:s?s.name:'Site',noPrefix:true},fileName:`${e.date||''} – ${what} – Rs ${e.amount}.jpg`,data:e.receipt});
      await _sbdSet({['done.'+_rcKey(e)]:true}); _sbd.done[_rcKey(e)]=true; sent++;
    }
    _sbdErr=''; _sbdLast=Date.now(); try{localStorage.setItem('sb_drive_last',String(_sbdLast));}catch(x){}
  }catch(e){ _sbdErr=String(e&&e.message||e); console.warn('Drive copy — will retry:',e); }
  finally{ _sbdBusy=false; const st=document.getElementById('sbDrvStatus'); if(st) st.innerHTML=_sbdStatusH(); }

}
function _sbdStatusH(){

}

function lastBackupAt(){ let t=0; DB.log.forEach(l=>{ if(!l.deleted&&/^Downloaded full backup/.test(l.text||'')&&(l.at||0)>t) t=l.at; }); return t; }
function backupNudgeHTML(){

    <div class="muted" style="margin-top:8px">The file has everything — sites, partners, every entry (receipt photos included), settlements, buy list and history. Keep it in Google Drive or WhatsApp to yourself.</div></div>`;

function downloadBackup(){
  const data={app:'SiteBooks',version:1,exportedAt:new Date().toISOString(),exportedBy:ME.name,counts:Object.fromEntries(KINDS.map(k=>[k,DB[k].length]))};
  KINDS.forEach(k=>{ data[k]=DB[k]; });
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const name='SiteBooks_Backup_'+todayStr()+'.json';
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);
  logAction(ME.name,'Downloaded full backup ('+KINDS.filter(k=>k!=='log').map(k=>active(k).length+' '+k).join(', ')+')');
  render(); toast('💾 Backup downloaded — '+name,3500);
}
let _restoreData=null;
function openRestore(){
  _restoreData=null;
  openModal(`<div class="modal-title">♻️ Restore from backup</div>
    <div class="card" style="font-size:12px;line-height:1.6;color:var(--text2)">Pick a <b>SiteBooks_Backup_….json</b> file. You'll see what's inside before anything changes.<br><b>Tip:</b> download a fresh backup first, so you can undo a restore.</div>
    <div class="form-group"><input type="file" accept=".json,application/json" class="form-input" onchange="restorePicked(this)"></div>
    <div id="rs_info"></div><button class="cancel-btn" onclick="closeModal()">Cancel</button>`);
}
function restorePicked(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    let d; try{ d=JSON.parse(e.target.result); }catch(_){ $('rs_info').innerHTML='<div class="card r">This is not a valid backup file.</div>'; return; }
    if(!d||d.app!=='SiteBooks'||!Array.isArray(d.sites)){ $('rs_info').innerHTML='<div class="card r">This file is not a SiteBooks backup.</div>'; return; }
    _restoreData=d;
    const rows=KINDS.filter(k=>k!=='log').map(k=>{ const inFile=(d[k]||[]).filter(x=>!x.deleted).length, now=active(k).length; return `<tr><td>${k}</td><td>${inFile}</td><td>${now}</td></tr>`; }).join('');
    $('rs_info').innerHTML=`<div class="muted" style="margin-bottom:6px">Backup from <b>${esc(new Date(d.exportedAt).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}))}</b> by ${esc(d.exportedBy||'—')}</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Records</th><th>In backup</th><th>In app now</th></tr></thead><tbody>${rows}</tbody></table></div>
      <button class="submit-btn" onclick="doRestore('replace')">Restore — make app match this backup</button>
      <div class="muted" style="margin:4px 2px 6px">Entries added after this backup are removed (soft-deleted, still recoverable from a newer backup).</div>
      <button class="cancel-btn" style="background:var(--bluebg);color:var(--blue);border-color:var(--blue)" onclick="doRestore('merge')">Merge — only bring back missing records</button>`;
  };
  r.readAsText(f);
}
async function doRestore(mode){
  const d=_restoreData; if(!d) return;
  if(!confirm(mode==='replace'?'Replace current data with this backup? All three partners will see the restored data.':'Bring back records from the backup that are missing or deleted in the app?')) return;
  toast('Restoring… keep the app open',4000);
  await pullAll();                                   // start from the latest server copy so revisions line up
  let changed=0;
  const put=(k,rec)=>{ const ex=findLocal(k,rec.id); const out={...rec,rev:(ex?.rev||0)+1,restoredAt:Date.now(),restoredBy:ME.name};
    upsertLocal(k,out); queue=queue.filter(q=>!(q.kind===k&&q.id===out.id)); queue.push({kind:k,id:out.id,baseRev:ex?.rev||0}); changed++; };
  KINDS.forEach(k=>{
    const inFile=d[k]||[]; const ids=new Set(inFile.map(x=>x.id));
    inFile.forEach(rec=>{
      if(!rec||!rec.id) return;
      const ex=findLocal(k,rec.id);
      if(mode==='merge'){ if(!ex||(ex.deleted&&!rec.deleted)) put(k,rec); return; }
      if(!ex||JSON.stringify({...ex,rev:0,updatedAt:0,updatedBy:0,restoredAt:0,restoredBy:0})!==JSON.stringify({...rec,rev:0,updatedAt:0,updatedBy:0,restoredAt:0,restoredBy:0})) put(k,rec);
    });
    if(mode==='replace'&&k!=='log'){ DB[k].filter(x=>!x.deleted&&!ids.has(x.id)).forEach(x=>put(k,{...x,deleted:true,deletedAt:Date.now(),deletedBy:ME.name+' (restore)'})); }
  });
  cacheSave(); qSave();
  logAction(ME.name,(mode==='replace'?'Restored':'Merged')+' backup from '+new Date(d.exportedAt).toLocaleDateString('en-IN')+' ('+changed+' records)');
  flushQueue(); closeModal(); render(); toast('✅ Restore done — '+changed+' record'+(changed!==1?'s':'')+' updated. Syncing…',4500);
}

/* ════════════ PLANNER — shared to-buy list + tasks/reminders, day by day ════════════
   Both live in the 'purchases' collection: type 'buy' (default for old records) or 'task'.
   • Ticking is one tap. Done items stay struck on the day they were done (and on that day when you look back).
   • Anything not done carries forward to today automatically, tagged "from <date>".
   • Tasks can be assigned to a partner or everyone, with an optional time = reminder.
   • The optional "cost & add to expenses" form for a bought item is still there inside the item. */
let PL_DAY='', PL_TYPE='all', BUY_SITE='all', PL_MINE=false;
const purchaseList=()=>active('purchases');
const plType=x=>x.type==='task'?'task':'buy';
const plDone=x=>x.status==='purchased'||x.status==='done';
const plDoneOn=x=>x.purchasedOn||x.doneOn||'';
const _dStr=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const plPlanDate=x=>plType(x)==='task'?(x.date||_dStr(x.createdAt||Date.now())):(x.planDate||_dStr(x.createdAt||Date.now()));
const myPid=()=>(partnerList().find(p=>p.name===(ME&&ME.name))||{}).id||('p_'+String(ME&&ME.name||'').toLowerCase());
const plMine=x=>!x.assignee||x.assignee==='all'||x.assignee===myPid();
function plShiftDay(n){ const d=new Date((PL_DAY||todayStr())+'T00:00:00'); d.setDate(d.getDate()+n); PL_DAY=_dStr(d.getTime()); render(); }
function plDayLabel(d){ const t=todayStr(); const y=new Date(t+'T00:00:00'); const diff=Math.round((new Date(d+'T00:00:00')-y)/864e5);
  const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(d+'T00:00:00').getDay()];
  return (diff===0?'Today':diff===-1?'Yesterday':diff===1?'Tomorrow':wd)+' · '+fmtDate(d); }
/* what belongs on day D */
function plItemsForDay(D,siteFilter){
  const t=todayStr();
  return purchaseList().filter(x=>{
    if(siteFilter==='general'?x.siteId:(siteFilter&&siteFilter!=='all'&&x.siteId!==siteFilter)) return false;
    if(PL_TYPE!=='all'&&plType(x)!==PL_TYPE) return false;
    if(PL_MINE&&!plMine(x)) return false;
    const pd=plPlanDate(x);
    if(plDone(x)) return plDoneOn(x)===D;              // struck on the day it was done
    if(D===t) return pd<=t;                             // today: everything open up to today (carried forward)
    if(D>t) return pd===D;                              // future day: what's planned for it
    return pd===D;                                      // past day: what was planned then (still open → shown as moved on)
  });
}
function plCounts(){ const t=todayStr(); const open=purchaseList().filter(x=>!plDone(x));
  const tasks=open.filter(x=>plType(x)==='task'&&plPlanDate(x)<=t&&plMine(x));
  return {buy:open.filter(x=>plType(x)==='buy').length, today:tasks.filter(x=>plPlanDate(x)===t).length, overdue:tasks.filter(x=>plPlanDate(x)<t).length}; }

  </div>`;
  h+=`<div class="tabs">${[['all','All'],['buy','🛒 To Buy'],['task','✅ Tasks']].map(([k,l])=>`<div class="tab ${PL_TYPE===k?'on':''}" onclick="PL_TYPE='${k}';render()">${l}</div>`).join('')}<div class="tab ${PL_MINE?'on':''}" onclick="PL_MINE=!PL_MINE;render()">👤 Mine</div></div>`;
  if(!siteId){

  if(!sorted.length) return h+`<div class="empty"><div class="emo">📋</div><p>${D<t?'Nothing was done or planned on this day.':D>t?'Nothing planned for this day yet.':'All clear for today. Add something to buy or a task above.'}</p></div>`;

function plRow(x,D){
  const t=todayStr(), done=plDone(x), task=plType(x)==='task', s=x.siteId?siteById(x.siteId):null;
  const pd=plPlanDate(x), carried=!done&&D===t&&pd<t, moved=!done&&D<t;
  const who=task?(x.assignee&&x.assignee!=='all'?'👤 '+esc(pname(x.assignee)):'👥 Everyone'):'';
  const meta=[task?'✅ Task':'🛒',s?esc(s.name):'General',who,x.time&&task?'⏰ '+esc(x.time):'',
    !task&&x.qty?esc(x.qty)+(x.unit?' '+esc(x.unit):''):'',x.priority==='high'?'<b class="r">URGENT</b>':'',
    carried?`<b class="r">from ${fmtDate(pd).slice(0,6)}</b>`:'', !task&&x.neededBy&&!done?`<span class="${x.neededBy<t?'r':''}">by ${fmtDate(x.neededBy).slice(0,6)}</span>`:'',
    done?`<span class="g">✓ ${esc(x.doneBy||x.updatedBy||'')}</span>`:''].filter(Boolean).join(' · ');
  const box=`<div onclick="event.stopPropagation();plToggle('${x.id}')" style="flex-shrink:0;width:26px;height:26px;border-radius:${task?'7px':'50%'};border:2px solid ${done?'var(--green)':x.priority==='high'?'var(--red)':'var(--border)'};background:${done?'var(--green)':'#fff'};color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;cursor:pointer">${done?'✓':''}</div>`;
  const ph=task&&x.assignee&&x.assignee!=='all'?(partnerById(x.assignee)||{}).phone:'';
  return `<div class="entry" style="align-items:center;${done||moved?'opacity:.6':''}${x.priority==='high'&&!done?';border-color:var(--redborder)':''}" onclick="${task?`openTaskForm('${x.id}')`:`openBuyForm('${x.id}')`}">
    ${box}<div class="entry-l" style="min-width:0;flex:1"><div class="entry-t" style="${done?'text-decoration:line-through':''}">${esc(x.item)}</div>
      <div class="entry-s">${meta}</div>${x.notes?`<div class="entry-s">${esc(x.notes)}</div>`:''}
      ${!task&&x.actualCost?`<div class="entry-s g">${inr(toPaise(x.actualCost))}${x.expenseId?' · in expenses':''}</div>`:''}</div>
    ${task&&!done?`<button class="mini-btn" style="background:#e7f8ee;color:#128c4a;flex-shrink:0" onclick="event.stopPropagation();plWhatsApp('${x.id}')">💬</button>`:''}
  </div>`;

function plWhatsApp(id){ const x=findLocal('purchases',id); if(!x) return;
  const ph=String((x.assignee&&x.assignee!=='all'?(partnerById(x.assignee)||{}).phone:'')||'').replace(/\D/g,'');
  const num=ph?(ph.length===10?'91'+ph:ph):''; window.open('https://wa.me/'+num+'?text='+encodeURIComponent(plTaskText(x)),'_blank'); }
function plCal(id){ const x=findLocal('purchases',id); if(!x) return;
  const d=(x.date||todayStr()).replace(/-/g,''); let dates;
  if(x.time){ const [hh,mm]=x.time.split(':'); const st=d+'T'+hh+mm+'00'; const e=new Date((x.date||todayStr())+'T'+x.time+':00'); e.setMinutes(e.getMinutes()+30);
    const en=_dStr(e.getTime()).replace(/-/g,'')+'T'+String(e.getHours()).padStart(2,'0')+String(e.getMinutes()).padStart(2,'0')+'00'; dates=st+'/'+en; }
  else { const n=new Date((x.date||todayStr())+'T00:00:00'); n.setDate(n.getDate()+1); dates=d+'/'+_dStr(n.getTime()).replace(/-/g,''); }
  window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(x.item)+'&dates='+dates+'&details='+encodeURIComponent(plTaskText(x))+'&ctz=Asia/Kolkata','_blank'); }

/* reminder alerts (while the app is open or recently used) */
function plEnableAlerts(){ if(typeof Notification==='undefined'){toast('This phone does not support alerts');return;}
  Notification.requestPermission().then(p=>{ toast(p==='granted'?'🔔 Alerts on':'Alerts were not allowed'); render(); plCheckDue(); }); }
const PL_SEEN_KEY='sitebooks_alerted_v1';
function plCheckDue(){
  if(!ME) return; let seen={}; try{seen=JSON.parse(localStorage.getItem(PL_SEEN_KEY)||'{}');}catch(e){}
  const now=new Date(), t=todayStr(), hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const due=purchaseList().filter(x=>plType(x)==='task'&&!plDone(x)&&plMine(x)&&x.time&&((x.date||t)<t||((x.date||t)===t&&x.time<=hm)));
  let n=0;
  due.forEach(x=>{ const key=x.id+'|'+(x.date||'')+'|'+x.time; if(seen[key]) return; seen[key]=1; n++;
    const body=(x.siteId&&siteById(x.siteId)?siteById(x.siteId).name+' · ':'')+'Due '+((x.date||t)<t?fmtDate(x.date):'now')+(x.time?' ('+x.time+')':'');
    if(typeof Notification!=='undefined'&&Notification.permission==='granted'&&navigator.serviceWorker){
      navigator.serviceWorker.getRegistration().then(r=>{ if(r) r.showNotification('⏰ '+x.item,{body,icon:'icon-192.png',badge:'icon-192.png',tag:'sb_'+x.id}); else toast('⏰ '+x.item,5000); }).catch(()=>toast('⏰ '+x.item,5000));
    } else toast('⏰ '+x.item+' — '+body,5000);
  });
  try{localStorage.setItem(PL_SEEN_KEY,JSON.stringify(seen));}catch(e){}
  try{ const c=plCounts(); if(navigator.setAppBadge){ const k=c.today+c.overdue; k?navigator.setAppBadge(k):navigator.clearAppBadge(); } }catch(e){}
}
setInterval(plCheckDue,60000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) setTimeout(plCheckDue,1500); });
function plHomeStrip(){
  const c=plCounts(); if(!c.buy&&!c.today&&!c.overdue) return '';
  return `<div class="card" style="display:flex;gap:8px;justify-content:space-around;text-align:center;cursor:pointer;margin-bottom:12px" onclick="PL_DAY=todayStr();go('buy')">
    <div><div style="font-weight:900;font-size:16px;color:${c.overdue?'var(--red)':'var(--text)'}">${c.overdue}</div><div class="muted">Overdue tasks</div></div>
    <div><div style="font-weight:900;font-size:16px">${c.today}</div><div class="muted">Tasks today</div></div>
    <div><div style="font-weight:900;font-size:16px;color:var(--accent)">${c.buy}</div><div class="muted">To buy</div></div></div>`;
}

    ${x&&x.status!=='purchased'?`<button class="cancel-btn" style="background:var(--greenbg);color:var(--green);border-color:var(--green)" onclick="closeModal();plToggle('${id}')">✓ Bought</button>`:''}

function saveBuyItem(id){
  const item=$('b_item').value.trim(); if(!item){toast('Enter what to buy');return;}
  const old=id?findLocal('purchases',id):null;
  const rec={...(old||{id:uid(),status:'pending',type:'buy',planDate:(PL_DAY&&PL_DAY>todayStr()?PL_DAY:todayStr())}),item,siteId:$('b_site').value,qty:$('b_qty').value.trim(),unit:$('b_unit').value.trim(),estCost:Number($('b_est').value||0),neededBy:$('b_need').value,priority:$('b_pri').value,notes:$('b_notes').value.trim()};
  saveRecord('purchases',rec,ME.name);
  logAction(ME.name,(old?'Edited':'Added')+' to buy list: '+item,rec.siteId);
  closeModal(); render(); toast(old?'Updated':'Added to buy list');
}
function openBoughtForm(id){
  const x=findLocal('purchases',id); if(!x) return;
  const s=x.siteId?siteById(x.siteId):null;
  const sitePids=s?(s.partners||[]).map(p=>p.pid):[];
  const pool=s?sitePids:partnerList().map(p=>p.id);
  const me=partnerList().find(p=>p.name===ME.name)?.id;
  const defPid=pool.includes(me)?me:pool[0];
  openModal(`<div class="modal-title">💰 Cost & Expense (optional)</div>
    <div class="card" style="margin-bottom:12px"><b>${esc(x.item)}</b><div class="muted">${s?esc(s.name):'General'}${x.qty?' · '+esc(x.qty)+(x.unit?' '+esc(x.unit):''):''}${x.estCost?' · est. '+inr(toPaise(x.estCost)):''}</div></div>
    <div class="form-row"><div class="form-group"><label class="form-label">Purchased on *</label><input type="date" class="form-input" id="bb_date" value="${x.purchasedOn||todayStr()}"></div><div class="form-group"><label class="form-label">Actual cost (₹) *</label><input type="number" class="form-input" id="bb_cost" inputmode="decimal" value="${x.estCost||''}"></div></div>
    <div class="form-row"><div class="form-group"><label class="form-label">Paid by</label><select class="form-select" id="bb_pid">${pool.map(pid=>`<option value="${pid}" ${pid===defPid?'selected':''}>${esc(pname(pid))}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Shop / vendor</label><input class="form-input" id="bb_vendor" value=""></div></div>
    ${s?`<label class="chk" style="margin:6px 0 8px"><input type="checkbox" id="bb_exp" checked onchange="$('bb_expwrap').style.display=this.checked?'block':'none'"> Also add as an expense on ${esc(s.name)}</label>
    <div id="bb_expwrap"><div class="form-row"><div class="form-group"><label class="form-label">Category</label><input class="form-input" id="bb_cat" value="Supplies" list="bb_catlist"><datalist id="bb_catlist"><option value="Supplies"><option value="Furniture"><option value="Repairs"><option value="Maintenance"><option value="Cleaning"></datalist></div><div class="form-group"><label class="form-label">Type</label><select class="form-select" id="bb_kind"><option value="run">Running cost</option><option value="setup">Setup / one-time</option></select></div></div>
    <div class="muted" style="margin-bottom:8px">Split as per site default: ${(s.expenseSplit||[]).map(z=>esc(pname(z.pid))+' '+z.pct+'%').join(' · ')}</div></div>`
    :`<div class="muted" style="margin-bottom:8px">This item isn't linked to a site, so it won't be added to any site's expenses.</div>`}
    <button class="submit-btn" onclick="saveBought('${id}')">Save</button><button class="cancel-btn" onclick="closeModal()">Cancel</button>`);
}
function saveBought(id){
  const x=findLocal('purchases',id); if(!x) return;
  const date=$('bb_date').value; if(!date){toast('Pick the purchase date');return;}
  const cost=Number($('bb_cost').value||0); if(!(cost>0)){toast('Enter the actual cost');return;}
  const pid=$('bb_pid').value; const vendor=$('bb_vendor').value.trim();
  let expenseId='';
  const s=x.siteId?siteById(x.siteId):null;
  if(s&&$('bb_exp')&&$('bb_exp').checked){
    const exp=saveRecord('expenses',{id:uid(),siteId:s.id,date,amount:cost,category:$('bb_cat').value.trim()||'Supplies',vendor,kind:$('bb_kind').value,
      paidBy:[{pid,amount:cost}],note:x.item+(x.qty?' ('+x.qty+(x.unit?' '+x.unit:'')+')':''),split:null,
      stampedSplit:(s.expenseSplit||[]).map(z=>({pid:z.pid,pct:z.pct})),receipt:'',fromPurchase:id},ME.name);
    expenseId=exp.id;
    logAction(ME.name,'Added expense '+inr(toPaise(cost))+' — '+x.item+' (from buy list)',s.id);
  }
  saveRecord('purchases',{...x,status:'purchased',purchasedOn:date,doneBy:x.doneBy||ME.name,actualCost:cost,paidBy:pid,vendor,expenseId},ME.name);
  logAction(ME.name,'Purchased '+x.item+' for '+inr(toPaise(cost)),x.siteId);
  closeModal(); render(); toast(expenseId?'✅ Marked purchased · added to site expenses':'✅ Marked purchased');
}
function unmarkBought(id){
  const x=findLocal('purchases',id); if(!x) return;
  const linked=x.expenseId?findLocal('expenses',x.expenseId):null;
  if(!confirm('Move "'+x.item+'" back to the to-buy list?'+(linked&&!linked.deleted?'\n\nThe expense that was added for it will also be removed.':''))) return;
  if(linked&&!linked.deleted){ deleteRecord('expenses',linked.id,ME.name); logAction(ME.name,'Deleted expense '+inr(toPaise(linked.amount||0))+' — '+x.item+' (purchase undone)',x.siteId); }
  saveRecord('purchases',{...x,status:'pending',purchasedOn:'',doneBy:'',actualCost:0,paidBy:'',vendor:'',expenseId:''},ME.name);
  logAction(ME.name,'Moved back to buy list: '+x.item,x.siteId);
  closeModal(); render(); toast('Back on the buy list');
}
function deleteBuyItem(id){
  const x=findLocal('purchases',id); if(!x) return;
  if(!confirm('Delete "'+x.item+'" from the list?'+(x.expenseId?'\n\nThe site expense already added for it stays — delete it from the site if needed.':''))) return;
  deleteRecord('purchases',id,ME.name); logAction(ME.name,'Removed from buy list: '+x.item,x.siteId);
  closeModal(); render(); toast('Deleted');
}

  if(!viewLog._loading){ viewLog._loading=true; sbdLoad().then(()=>{ viewLog._loading=false; if(TAB==='log'){ const c=document.getElementById('sbDrvWrap'); if(c) c.innerHTML=sbDriveCardHTML(); } }).catch(()=>{ viewLog._loading=false; }); }
  let h=backupCardHTML()+`<div id="sbDrvWrap">${sbDriveCardHTML()}</div><div class="sec-hdr">Recent activity</div>`;
  if(!rows.length) return h+`<div class="empty"><p>Nothing yet.</p></div>`;
  return h+rows.map(l=>{ const d=new Date(l.at||0); const ts=d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); const s=l.siteId?siteById(l.siteId):null;

function pdfMoney(paise){ const n=Math.round(Math.abs(paise)/100); const s=String(n); const l3=s.slice(-3), r=s.slice(0,-3); return (paise<0?'-':'')+'Rs. '+(r?r.replace(/\B(?=(\d{2})+(?!\d))/g,',')+',':'')+l3; }
function fmtDPdf(d){ return fmtDate(d).replace(/ /g,'-'); }

function makePDF(sitesToShow,title,from,to,ropts){
  ropts=ropts||{};
  const exOf=sid=>ropts.noSetup?expensesOf(sid).filter(e=>e.kind!=='setup'):expensesOf(sid);
  if(!window.jspdf||!window.jspdf.jsPDF){ alert('PDF library did not load. Check your internet connection and try again.'); return null; }
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
  const PW=210,PH=297,ML=14,MR=196,CW=MR-ML;
  const O=[240,90,0],DARK=[28,29,46],MUT=[148,150,176],WHITE=[255,255,255],LIGHT=[247,248,252],GREEN=[22,160,106],RED=[224,53,53],BDR=[220,224,240];
  let pageNum=0;
  function addPage(){ if(pageNum>0)doc.addPage(); pageNum++;
    doc.setFillColor(...O);doc.rect(0,0,PW,20,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...WHITE);doc.text(BRAND.toUpperCase(),ML,8);
    doc.setFont('helvetica','normal');doc.setFontSize(7);doc.text('Partnership Ledger',ML,13.5);
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text(title.toUpperCase(),MR,8,{align:'right'});
    doc.setFont('helvetica','normal');doc.setFontSize(7);doc.text('Generated: '+new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})+' by '+ME.name,MR,13.5,{align:'right'});
    doc.setTextColor(...MUT);doc.setFontSize(7);doc.text('Page '+pageNum,MR,PH-6,{align:'right'}); doc.text(BRAND,ML,PH-6); return 28; }
  const checkY=(y,need=10)=>{ if(y+need>PH-14) y=addPage(); return y; };
  const hr=(y,col=BDR)=>{ doc.setDrawColor(...col);doc.setLineWidth(0.25);doc.line(ML,y,MR,y);return y+1; };
  let y=addPage();
  const period=((from||to)?('Period: '+(from?fmtDPdf(from):'start')+' to '+(to?fmtDPdf(to):'today')):'Period: all time')+(ropts.noSetup?'  |  One-time setup costs excluded':'');

  // overall summary when more than one site
  if(sitesToShow.length>1){
    const eb={},ib={},sb={}; sitesToShow.forEach(s=>{eb[s.id]=exOf(s.id);ib[s.id]=incomesOf(s.id);sb[s.id]=settlementsOf(s.id);});
    const o=computeOverall(sitesToShow,eb,ib,sb,{from,to});
    doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(...DARK);doc.text('Overall Profit & Loss',ML,y);y+=5;
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...MUT);doc.text(period,ML,y);y+=6;y=hr(y);y+=3;
    const box=(label,val,col,i)=>{ const bw=CW/3-2,bx=ML+i*(bw+3); doc.setLineWidth(0.25);doc.setDrawColor(...BDR);doc.setFillColor(...LIGHT);doc.rect(bx,y,bw,20,'FD'); doc.setDrawColor(...col);doc.setLineWidth(1.2);doc.line(bx,y,bx+bw,y);doc.setLineWidth(0.25); doc.setFont('helvetica','bold');doc.setFontSize(6);doc.setTextColor(...MUT);doc.text(label,bx+bw/2,y+6,{align:'center'}); doc.setFontSize(10);doc.setTextColor(...col);doc.text(pdfMoney(val),bx+bw/2,y+14,{align:'center'}); };
    box('TOTAL INCOME',o.totalInc,GREEN,0); box('TOTAL EXPENSES',o.totalExp,RED,1); box(o.profit<0?'NET LOSS':'NET PROFIT',o.profit,o.profit>=0?GREEN:RED,2); y+=27;
    { const b=bookingBreakdown(sitesToShow.map(x=>x.id),from,to); if(b.withBk){ doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...DARK);
      doc.text('Bookings: guest paid '+pdfMoney(b.gross)+'  |  Airbnb fees -'+pdfMoney(b.fee)+'  |  TDS -'+pdfMoney(b.tds)+'  |  Net in hand '+pdfMoney(b.net),ML,y); y+=7; } }
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...DARK);doc.text('Site-wise',ML,y);y+=2;y=hr(y,O);y+=3;
    doc.setFillColor(...O);doc.rect(ML,y-1,CW,7,'F');doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...WHITE);doc.text('Site',ML+1,y+4);doc.text('Income',ML+95,y+4,{align:'right'});doc.text('Expenses',ML+135,y+4,{align:'right'});doc.text('Profit / Loss',MR-1,y+4,{align:'right'});y+=9;
    let alt=false; o.per.forEach(({site,res})=>{ y=checkY(y,8); if(alt){doc.setFillColor(...LIGHT);doc.rect(ML,y-1,CW,7,'F');} alt=!alt; doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...DARK);doc.text(doc.splitTextToSize(site.name,70)[0],ML+1,y+4);doc.setTextColor(...GREEN);doc.text(pdfMoney(res.totalInc),ML+95,y+4,{align:'right'});doc.setTextColor(...RED);doc.text(pdfMoney(res.totalExp),ML+135,y+4,{align:'right'});doc.setFont('helvetica','bold');doc.setTextColor(...(res.profit>=0?GREEN:RED));doc.text(pdfMoney(res.profit),MR-1,y+4,{align:'right'});y+=7; });
    // monthly

      doc.setFillColor(...O);doc.rect(ML,y-1,CW,7,'F');doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...WHITE);doc.text('Month',ML+1,y+4);doc.text('Income',ML+95,y+4,{align:'right'});doc.text('Expenses',ML+135,y+4,{align:'right'});doc.text('Profit / Loss',MR-1,y+4,{align:'right'});y+=9;
      alt=false; o.byMonth.forEach(m=>{ y=checkY(y,8); if(alt){doc.setFillColor(...LIGHT);doc.rect(ML,y-1,CW,7,'F');} alt=!alt; const p=m.inc-m.exp; doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...DARK);doc.text(monthLabel(m.month),ML+1,y+4);doc.setTextColor(...GREEN);doc.text(pdfMoney(m.inc),ML+95,y+4,{align:'right'});doc.setTextColor(...RED);doc.text(pdfMoney(m.exp),ML+135,y+4,{align:'right'});doc.setFont('helvetica','bold');doc.setTextColor(...(p>=0?GREEN:RED));doc.text(pdfMoney(p),MR-1,y+4,{align:'right'});y+=7; }); }
    const oT=ropts.noSetup?computeOverall(sitesToShow,Object.fromEntries(sitesToShow.map(s=>[s.id,expensesOf(s.id)])),ib,sb,{from,to}).transfers:o.transfers;
    if(oT.length){ y=checkY(y,30); y+=6; doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...DARK);doc.text('Settlement due (all sites)',ML,y);y+=2;y=hr(y,O);y+=4; oT.forEach(t=>{ y=checkY(y,7); doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...DARK);doc.text(pname(t.from)+'  pays  '+pname(t.to),ML+1,y); doc.setFont('helvetica','bold');doc.text(pdfMoney(t.amount),MR-1,y,{align:'right'}); y+=6; }); }
  }

  sitesToShow.forEach((site,idx)=>{
    if(sitesToShow.length>1||idx>0) y=addPage();
    const res=computeSite(site,exOf(site.id),incomesOf(site.id),settlementsOf(site.id),{from,to});
    const resFull=ropts.noSetup?computeSite(site,expensesOf(site.id),incomesOf(site.id),settlementsOf(site.id),{from,to}):res;
    doc.setFillColor(...LIGHT);doc.rect(ML,y-2,CW,10,'F');doc.setDrawColor(...BDR);doc.setLineWidth(0.3);doc.rect(ML,y-2,CW,10,'S');
    doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(...DARK);doc.text(site.name,ML+3,y+5);y+=12;
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...MUT);doc.text((site.address?site.address+'  |  ':'')+period,ML,y);y+=7;y=hr(y);y+=3;
    const bw=CW/4-2;
    [['INCOME',res.totalInc,GREEN],['EXPENSES',res.totalExp,RED],[res.profit<0?'LOSS':'PROFIT',res.profit,res.profit>=0?GREEN:RED],[ropts.noSetup?'SETUP (EXCLUDED)':'SETUP COST',resFull.totalSetupExp,ropts.noSetup?MUT:O]].forEach(([l,v,c],i)=>{ const bx=ML+i*(bw+2.7); doc.setLineWidth(0.25);doc.setDrawColor(...BDR);doc.setFillColor(...LIGHT);doc.rect(bx,y,bw,20,'FD');doc.setDrawColor(...c);doc.setLineWidth(1.2);doc.line(bx,y,bx+bw,y);doc.setLineWidth(0.25);doc.setFont('helvetica','bold');doc.setFontSize(6);doc.setTextColor(...MUT);doc.text(l,bx+bw/2,y+6,{align:'center'});doc.setFontSize(v>=100000000?7:9);doc.setTextColor(...c);doc.text(pdfMoney(v),bx+bw/2,y+14,{align:'center'}); }); y+=27;
    { const b=bookingBreakdown([site.id],from,to); if(b.withBk){ doc.setFillColor(...LIGHT);doc.rect(ML,y-2,CW,9,'F'); doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...DARK);
      doc.text('Bookings:  Guest paid '+pdfMoney(b.gross)+'   |   Airbnb fees -'+pdfMoney(b.fee)+'   |   TDS -'+pdfMoney(b.tds)+(b.other?'   |   Other -'+pdfMoney(b.other):'')+'   |   Net in hand '+pdfMoney(b.net),ML+2,y+3.5); y+=12; } }

    // partner table
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...DARK);doc.text('Partners — who paid, who owes',ML,y);y+=2;y=hr(y,O);y+=3;
    doc.setFillColor(...O);doc.rect(ML,y-1,CW,7,'F');doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(...WHITE);
    doc.text('Partner',ML+1,y+4);doc.text('Profit %',ML+50,y+4,{align:'right'});doc.text('Paid out',ML+80,y+4,{align:'right'});doc.text('Collected',ML+110,y+4,{align:'right'});doc.text('Profit share',ML+142,y+4,{align:'right'});doc.text('Net',MR-1,y+4,{align:'right'});y+=9;
    let alt=false; Object.values(resFull.partners).forEach(p=>{ y=checkY(y,8); if(alt){doc.setFillColor(...LIGHT);doc.rect(ML,y-1,CW,7,'F');} alt=!alt; const sp=(site.profitSplit||[]).find(x=>x.pid===p.pid); const ps=res.profitParts[p.pid]||0;
      doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...DARK);doc.text(pname(p.pid),ML+1,y+4);
      doc.setFont('helvetica','normal');doc.text(sp?sp.pct+'%':'-',ML+50,y+4,{align:'right'});doc.text(pdfMoney(p.paidOut),ML+80,y+4,{align:'right'});doc.text(pdfMoney(p.revHeld),ML+110,y+4,{align:'right'});
      doc.setTextColor(...(ps>=0?GREEN:RED));doc.text(pdfMoney(ps),ML+142,y+4,{align:'right'});
      doc.setFont('helvetica','bold');doc.setTextColor(...(p.net>0?GREEN:p.net<0?RED:MUT));doc.text(p.net===0?'Settled':(p.net>0?'Gets ':'Owes ')+pdfMoney(Math.abs(p.net)),MR-1,y+4,{align:'right'});y+=7; });
    const tr=settleUp(Object.fromEntries(Object.values(resFull.partners).map(p=>[p.pid,p.net])));
    if(tr.length){ y+=3; doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...DARK);doc.text('To settle:',ML+1,y);y+=5; tr.forEach(t=>{ y=checkY(y,6); doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text(pname(t.from)+'  pays  '+pname(t.to)+'   '+pdfMoney(t.amount),ML+4,y);y+=5; }); }
    y+=4;

    // ledger
    if(ropts.ledger!==false){
    y=checkY(y,25); doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...DARK);doc.text('Complete Ledger',ML,y);y+=2;y=hr(y,O);y+=3;
    doc.setFillColor(...O);doc.rect(ML,y-1,CW,7,'F');doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...WHITE);doc.text('Date',ML+1,y+4);doc.text('Type',ML+24,y+4);doc.text('Description',ML+44,y+4);doc.text('Amount',MR-1,y+4,{align:'right'});y+=9;
    const inR=d=>(!from||d>=from)&&(!to||d<=to);
    const entries=[...exOf(site.id).filter(e=>inR(e.date)).map(e=>({d:e.date,t:e.kind==='setup'?'SETUP':'EXPENSE',amt:e.amount,desc:[e.note,e.category,e.vendor?'to '+e.vendor:'','paid by '+(e.paidBy||[]).map(l=>pname(l.pid)).join('+')].filter(Boolean).join(' · '),c:RED})),
      ...incomesOf(site.id).filter(e=>inR(e.date)).map(e=>({d:e.date,t:e.kind==='capital'?'CAPITAL':e.kind==='refund'?'REFUND':'INCOME',amt:e.amount,desc:[e.note,e.source,(e.kind==='capital'?'from '+(e.contributedBy||[]).map(l=>pname(l.pid)).join('+')+' to be held by ':'recd by ')+(e.receivedBy||[]).map(l=>pname(l.pid)).join('+')].filter(Boolean).join(' · '),c:GREEN})),
      ...settlementsOf(site.id).filter(e=>inR(e.date)).map(e=>({d:e.date,t:'SETTLE',amt:e.amount,desc:pname(e.from)+' paid '+pname(e.to)+(e.note?' · '+e.note:''),c:[43,110,240]}))].sort((a,b)=>a.d.localeCompare(b.d));

    }
  });
  return doc;
}
async function shareOrSave(doc,name){
  const blob=doc.output('blob'); const file=new File([blob],name,{type:'application/pdf'});
  try{ if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({title:name,files:[file]}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);
}
async function exportSitePDF(id){ const s=siteById(id); const doc=makePDF([s],'Site Ledger Report',_repFrom,_repTo,{noSetup:REP_NO_SETUP}); if(doc) await shareOrSave(doc,'UrbanHaven_Ledger_'+s.name.replace(/[^a-z0-9]+/gi,'_')+'.pdf'); }
