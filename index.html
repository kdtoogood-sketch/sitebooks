<style>

<body>

<script>
/* ════════════════════════════════════════════════════════════
   ENGINE — pure functions, no DOM. All money is handled in PAISE
   (integers) internally so that splits never leave rounding drift.
   ════════════════════════════════════════════════════════════ */

// ---- money helpers -------------------------------------------------
function toPaise(rupees){ return Math.round(Number(rupees||0)*100); }
function toRupees(paise){ return (paise||0)/100; }

/* Split `totalPaise` across shares (percentages, must be > 0 sum).
   Uses the largest-remainder method so parts ALWAYS add up to the total exactly.
   shares: [{pid, pct}]  ->  {pid: paise} */
function splitPaise(totalPaise, shares){
  const out={};
  const list=(shares||[]).filter(s=>Number(s.pct)>0);
  const sum=list.reduce((a,s)=>a+Number(s.pct),0);
  if(!list.length||sum<=0){ return out; }
  const sign=totalPaise<0?-1:1;
  const abs=Math.abs(totalPaise);
  let used=0;
  const rows=list.map(s=>{
    const exact=abs*Number(s.pct)/sum;
    const floor=Math.floor(exact);
    used+=floor;
    return {pid:s.pid,floor,frac:exact-floor};
  });
  let rem=abs-used;
  rows.slice().sort((a,b)=>b.frac-a.frac).forEach(r=>{ if(rem>0){r.floor+=1;rem-=1;} });
  rows.forEach(r=>{ out[r.pid]=(out[r.pid]||0)+sign*r.floor; });
  return out;
}

/* Amount lines like paidBy / receivedBy: [{pid, amount(rupees)}] -> {pid: paise} */
function sumLines(lines){
  const out={};
  (lines||[]).forEach(l=>{
    const p=toPaise(l.amount);
    if(!l.pid||!p)return;
    out[l.pid]=(out[l.pid]||0)+p;
  });
  return out;
}

function pctTotal(shares){ return Math.round((shares||[]).reduce((a,s)=>a+Number(s.pct||0),0)*1000)/1000; }

/* ---- validation used by the UI and by tests -------------------- */
function validateShares(shares){
  const t=pctTotal(shares);
  if(!shares||!shares.length) return {ok:false,msg:'Add at least one partner'};
  if(shares.some(s=>Number(s.pct)<0)) return {ok:false,msg:'Percentages cannot be negative'};
  if(Math.abs(t-100)>0.001) return {ok:false,msg:'Shares total '+t+'% — must be exactly 100%'};
  return {ok:true,msg:''};
}
function validateLines(lines,totalRupees,label){
  const ls=(lines||[]).filter(l=>l.pid&&Number(l.amount)>0);
  if(!ls.length) return {ok:false,msg:label+': choose at least one partner and amount'};
  const sum=ls.reduce((a,l)=>a+toPaise(l.amount),0);
  const tot=toPaise(totalRupees);
  if(sum!==tot) return {ok:false,msg:label+' lines add to '+toRupees(sum).toLocaleString('en-IN')+' but the total is '+toRupees(tot).toLocaleString('en-IN')};
  return {ok:true,msg:''};
}

/* ════════════════════════════════════════════════════════════
   SITE POSITION
   For one site, compute each partner's:
     paidOut       – what they paid toward expenses/capital-setup
     expShare      – their share of all expenses
     revHeld       – income they physically received
     revShare      – their share of income (by PROFIT ratio)
     settledOut    – settlement money they paid to others
     settledIn     – settlement money they received from others
     net           – positive => partnership owes THEM; negative => THEY owe
   The settlement is:  net = (paidOut - expShare) + (revShare - revHeld) + settledOut - settledIn
   Intuition: money they put in beyond their share is owed back; revenue they are
   holding beyond their share of it must be handed over.
   ════════════════════════════════════════════════════════════ */
function computeSite(site, expenses, incomes, settlements, opts){
  opts=opts||{};
  const from=opts.from||'', to=opts.to||'';
  const inRange=d=>(!from||d>=from)&&(!to||d<=to);
  const pids=(site.partners||[]).map(p=>p.pid);
  const P={};
  pids.forEach(pid=>{ P[pid]={pid,paidOut:0,expShare:0,revHeld:0,revShare:0,settledOut:0,settledIn:0,capitalIn:0,capitalHeld:0,overrideShare:0,net:0}; });
  const ensure=pid=>{ if(!P[pid])P[pid]={pid,paidOut:0,expShare:0,revHeld:0,revShare:0,settledOut:0,settledIn:0,capitalIn:0,capitalHeld:0,overrideShare:0,net:0,removed:true}; return P[pid]; };

  let totalOverrideExp=0, totalExp=0, totalRunExp=0, totalSetupExp=0, totalInc=0, totalCapital=0, totalRefund=0;
  const byCategory={}, byMonth={};
  const mon=d=>(d||'').slice(0,7);
  const bump=(m,k,v)=>{ if(!m)return; byMonth[m]=byMonth[m]||{month:m,exp:0,inc:0,runExp:0,setupExp:0}; byMonth[m][k]+=v; };

  (expenses||[]).filter(e=>!e.deleted&&inRange(e.date)).forEach(e=>{
    const amt=toPaise(e.amount);
    totalExp+=amt;
    if(e.kind==='setup') totalSetupExp+=amt; else totalRunExp+=amt;
    const cat=(e.category||'Uncategorised');
    byCategory[cat]=(byCategory[cat]||0)+amt;
    bump(mon(e.date),'exp',amt);
    bump(mon(e.date),e.kind==='setup'?'setupExp':'runExp',amt);
    // who paid
    const paid=sumLines(e.paidBy);
    Object.keys(paid).forEach(pid=>{ ensure(pid).paidOut+=paid[pid]; });
    // who bears it — the split STORED ON THE ENTRY (so later site-split edits never rewrite history)
    // Resolution order:  explicit per-entry override  >  split stamped when the entry was saved  >  site's current split.
    // The stamp is what keeps history stable when someone later edits the site's percentages.
    const overridden=!!(e.split&&e.split.length);
    const shares=overridden?e.split:((e.stampedSplit&&e.stampedSplit.length)?e.stampedSplit:(site.expenseSplit||[]));
    const parts=splitPaise(amt,shares);
    Object.keys(parts).forEach(pid=>{ ensure(pid).expShare+=parts[pid]; });
    if(overridden){
      // settled on its own terms, outside the pooled profit calculation
      totalOverrideExp+=amt;
      Object.keys(parts).forEach(pid=>{ ensure(pid).overrideShare=(P[pid].overrideShare||0)+parts[pid]; });
    }
  });

  (incomes||[]).filter(i=>!i.deleted&&inRange(i.date)).forEach(i=>{
    const amt=toPaise(i.amount);
    const held=sumLines(i.receivedBy);
    if(i.kind==='capital'){
      /* A capital contribution is money one partner hands over to be held by another (or by the
         partner who is running the site). It is NOT income and NOT profit.
         Modelled as a transfer:  contributedBy (paid in)  ->  receivedBy (now holds it).
         The holder is now holding partnership money, so they owe it back; the contributor is owed it. */
      totalCapital+=amt;
      const gave=sumLines(i.contributedBy);
      Object.keys(gave).forEach(pid=>{ ensure(pid).capitalIn+=gave[pid]; });
      Object.keys(held).forEach(pid=>{ ensure(pid).capitalHeld=(P[pid].capitalHeld||0)+held[pid]; });
      return;
    }
    if(i.kind==='refund'){
      // deposit refund received: reduces cost, is partnership money held by receiver
      totalRefund+=amt;
    } else {
      totalInc+=amt;
      bump(mon(i.date),'inc',amt);
    }
    Object.keys(held).forEach(pid=>{ ensure(pid).revHeld+=held[pid]; });
    // Rule A only ("separate"): each income entry is shared by the profit ratio on its own.
    if(site.profitRule==='separate'){
      const shares=(i.split&&i.split.length)?i.split:(site.profitSplit||[]);
      const parts=splitPaise(amt,shares);
      Object.keys(parts).forEach(pid=>{ ensure(pid).revShare+=parts[pid]; });
    }
  });

  (settlements||[]).filter(s=>!s.deleted&&inRange(s.date)).forEach(s=>{
    const amt=toPaise(s.amount);
    if(s.from) ensure(s.from).settledOut+=amt;
    if(s.to)   ensure(s.to).settledIn+=amt;
  });

  // Net of refunds counts against expenses for profit purposes
  const netExpenses=totalExp-totalRefund;
  const profit=totalInc-netExpenses;                       // headline profit (all costs)
  // For the pooled rule, costs carrying an explicit per-entry split are borne by exactly those people,
  // so the amount left to share by the profit ratio is income − refunds' effect − NON-overridden costs.
  const poolProfit=totalInc-(totalExp-totalOverrideExp-totalRefund);
  const poolParts=splitPaise(poolProfit,site.profitSplit||[]);
  const profitParts=splitPaise(profit,site.profitSplit||[]);   // shown on reports

  /* Two ways to settle, chosen per site (site.profitRule):
     'pooled'   (DEFAULT, Rule B): pool costs against income, then share the PROFIT by the profit ratio.
                entitlement = profit share.
     'separate' (Rule A): costs follow the expense ratio, income follows the profit ratio.
                entitlement = revShare(income by profit ratio) − expShare(costs by expense ratio).
     In both, cashNow is what the partner has physically paid out / is holding:
                cashNow = revHeld + refunds held − paidOut − capitalIn      (capital is returned to them)
     and  net = entitlement − cashNow  (+ settlements already made).
     When expense ratio == profit ratio the two rules give identical numbers. */
  Object.values(P).forEach(p=>{
    // capital: what they handed over is owed back to them; what they now hold is owed to others
    const cashNow=p.revHeld-p.paidOut-p.capitalIn+p.capitalHeld;
    let entitled;
    if(site.profitRule==='separate'){ entitled=p.revShare-p.expShare; }
    else { entitled=(poolParts[p.pid]||0)-(p.overrideShare||0); p.revShare=poolParts[p.pid]||0; }
    p.entitled=entitled;
    p.net=(entitled-cashNow)+p.settledOut-p.settledIn;
  });

  return {
    partners:P, totalExp, totalRunExp, totalSetupExp, totalInc, totalCapital, totalRefund,
    netExpenses, profit,
    runningProfit: totalInc-(totalRunExp-0), // before setup/one-time costs
    profitParts, byCategory, byMonth:Object.values(byMonth).sort((a,b)=>a.month.localeCompare(b.month))
  };
}

/* Minimum-transfers settlement.
   Input: {pid: netPaise}  (positive = is owed, negative = owes). Must sum to ~0.
   Greedy: repeatedly match the largest debtor with the largest creditor.
   Returns [{from,to,amount(paise)}].  */
function settleUp(netByPid){
  const cred=[], debt=[];
  Object.keys(netByPid).forEach(pid=>{
    const v=netByPid[pid];
    if(v>0)cred.push({pid,v}); else if(v<0)debt.push({pid,v:-v});
  });
  const out=[];
  cred.sort((a,b)=>b.v-a.v); debt.sort((a,b)=>b.v-a.v);
  let i=0,j=0;
  while(i<cred.length&&j<debt.length){
    const x=Math.min(cred[i].v,debt[j].v);
    if(x>0) out.push({from:debt[j].pid,to:cred[i].pid,amount:x});
    cred[i].v-=x; debt[j].v-=x;
    if(cred[i].v===0)i++;
    if(debt[j].v===0)j++;
  }
  return out;
}

/* Overall position across MANY sites: sums each partner's net and settles once */
function computeOverall(sites, expByS, incByS, setByS, opts){
  const per=[]; const tot={}; let totalExp=0,totalInc=0,profit=0,totalCapital=0;
  const byMonth={};
  sites.forEach(s=>{
    const r=computeSite(s,expByS[s.id]||[],incByS[s.id]||[],setByS[s.id]||[],opts);
    per.push({site:s,res:r});
    totalExp+=r.totalExp; totalInc+=r.totalInc; profit+=r.profit; totalCapital+=r.totalCapital;
    Object.values(r.partners).forEach(p=>{ tot[p.pid]=(tot[p.pid]||0)+p.net; });
    r.byMonth.forEach(m=>{
      const b=byMonth[m.month]=byMonth[m.month]||{month:m.month,exp:0,inc:0,runExp:0,setupExp:0};
      b.exp+=m.exp;b.inc+=m.inc;b.runExp+=m.runExp;b.setupExp+=m.setupExp;
    });
  });
  return {per,netByPid:tot,transfers:settleUp(tot),totalExp,totalInc,profit,totalCapital,
          byMonth:Object.values(byMonth).sort((a,b)=>a.month.localeCompare(b.month))};
}


/* ════════════════════════════════════════════════════════════
   STORE — one Firestore document per record.
   Collection layout (all under  sitebooks_<kind>/<id>):
     sitebooks_partners   sitebooks_sites   sitebooks_expenses
     sitebooks_incomes    sitebooks_settlements   sitebooks_log
   Why per-record: with 3 people entering money at the same time, a single
   shared blob means "last save wins" and silently drops someone's entry.
   Here two people adding different entries never touch the same document.
   Edits to the SAME record use optimistic concurrency (rev number).
   Works with plain fetch (REST) — no SDK, matching the rest of your apps.
   ════════════════════════════════════════════════════════════ */

const FB_PROJECT='propdesk-f50e0';
const FB_KEY='AIzaSyBiBmFAJHTxoZAddAON94u7FQ_d-RpX2io';

const KINDS=['partners','sites','expenses','incomes','settlements','log'];
const COLL=k=>'sitebooks_'+k;

/* ---- Firestore value encoding ---- */
function fsEnc(v){
  if(v===null||v===undefined) return {nullValue:null};
  if(typeof v==='boolean') return {booleanValue:v};
  if(typeof v==='number')  return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
  if(typeof v==='string')  return {stringValue:v};
  if(Array.isArray(v))     return {arrayValue:{values:v.map(fsEnc)}};
  if(typeof v==='object')  return {mapValue:{fields:Object.fromEntries(Object.entries(v).filter(([,x])=>x!==undefined).map(([k,x])=>[k,fsEnc(x)]))}};
  return {stringValue:String(v)};
}
function fsDec(v){
  if(!v) return null;
  if('nullValue' in v) return null;
  if('booleanValue' in v) return v.booleanValue;
  if('integerValue' in v) return Number(v.integerValue);
  if('doubleValue' in v) return v.doubleValue;
  if('stringValue' in v) return v.stringValue;
  if('arrayValue' in v) return (v.arrayValue.values||[]).map(fsDec);
  if('mapValue' in v) return Object.fromEntries(Object.entries(v.mapValue.fields||{}).map(([k,x])=>[k,fsDec(x)]));
  return null;
}
const docToObj=d=>{ const o=Object.fromEntries(Object.entries(d.fields||{}).map(([k,v])=>[k,fsDec(v)])); return o; };
const objToDoc=o=>({fields:Object.fromEntries(Object.entries(o).filter(([,x])=>x!==undefined).map(([k,v])=>[k,fsEnc(v)]))});

/* ---- in-memory + localStorage cache (so the app opens instantly and works on bad signal) ---- */

const LS_KEY='sitebooks_cache_v1';
function cacheSave(){ try{localStorage.setItem(LS_KEY,JSON.stringify(DB));}catch(e){} }
function cacheLoad(){ try{const r=localStorage.getItem(LS_KEY); if(r){const o=JSON.parse(r); KINDS.forEach(k=>{DB[k]=o[k]||[];});}}catch(e){} }

/* pending write queue: survives offline, retried on next tick */
const QUEUE_KEY='sitebooks_queue_v1';
let queue=[]; try{queue=JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]');}catch(e){queue=[];}
const qSave=()=>{ try{localStorage.setItem(QUEUE_KEY,JSON.stringify(queue));}catch(e){} };

let syncState='synced';           // 'synced' | 'saving' | 'error'
let onSyncChange=()=>{};
function _setSyncCb(f){ onSyncChange=f; }
function _queueLen(){ return queue.length; }
function setSync(s){ if(syncState!==s){syncState=s;onSyncChange(s);} }

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ---- low level REST ---- */
async function fsList(kind){
  let out=[], token='';
  do{
    const url=`${FB_BASE}/${COLL(kind)}?key=${FB_KEY}&pageSize=300${token?'&pageToken='+encodeURIComponent(token):''}`;
    const r=await fetch(url,{cache:'no-store'});
    if(r.status===404) return [];          // collection doesn't exist yet
    if(!r.ok) throw new Error('list '+kind+' '+r.status);
    const j=await r.json();
    (j.documents||[]).forEach(d=>{ const o=docToObj(d); o.id=d.name.split('/').pop(); out.push(o); });
    token=j.nextPageToken||'';
  }while(token);
  return out;
}
async function fsGet(kind,id){
  const r=await fetch(`${FB_BASE}/${COLL(kind)}/${id}?key=${FB_KEY}`,{cache:'no-store'});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('get '+r.status);
  const d=await r.json(); const o=docToObj(d); o.id=id; return o;
}
async function fsSet(kind,obj){
  const {id,...rest}=obj;
  const r=await fetch(`${FB_BASE}/${COLL(kind)}/${id}?key=${FB_KEY}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(objToDoc(rest))});
  if(!r.ok) throw new Error('set '+kind+' '+r.status);
}

/* ---- local record helpers ---- */
const listOf=k=>DB[k];
function findLocal(kind,id){ return DB[kind].find(x=>x.id===id); }
function upsertLocal(kind,obj){
  const i=DB[kind].findIndex(x=>x.id===obj.id);
  if(i>=0) DB[kind][i]=obj; else DB[kind].push(obj);
}

/* Save a record: write locally at once (UI stays instant), queue the network write. */
function saveRecord(kind,obj,who){
  const now=Date.now();
  const existing=findLocal(kind,obj.id);
  const rec={...obj};
  if(!rec.id) rec.id=uid();
  rec.rev=(existing?.rev||0)+1;
  rec.updatedAt=now; rec.updatedBy=who||'';
  if(!existing){ rec.createdAt=now; rec.createdBy=who||''; } else { rec.createdAt=existing.createdAt; rec.createdBy=existing.createdBy; }
  upsertLocal(kind,rec); cacheSave();
  queue=queue.filter(q=>!(q.kind===kind&&q.id===rec.id));   // newest version replaces older queued one
  queue.push({kind,id:rec.id,baseRev:existing?.rev||0});
  qSave(); flushQueue();
  return rec;
}
/* Soft delete — records are never physically removed, so a mistake is recoverable and the log stays honest */
function deleteRecord(kind,id,who){
  const e=findLocal(kind,id); if(!e) return;
  return saveRecord(kind,{...e,deleted:true,deletedAt:Date.now(),deletedBy:who||''},who);
}

let flushPromise=null, flushAgain=false;
/* Returns the in-flight flush so callers can await the REAL work. If more items are queued while a
   flush is running, it loops again rather than returning early and leaving them stranded.

   IMPORTANT: the async body can finish synchronously (e.g. called with an empty queue). The promise is therefore
   cleared from a .then() that runs AFTER the assignment below — never from a `finally` inside the body, which
   would run first and then be overwritten, leaving a dead promise installed forever. */
async function _flushBody(){
  do{
    flushAgain=false;
    while(queue.length){
      const q=queue[0]; const local=findLocal(q.kind,q.id);
      if(!local){ queue.shift(); qSave(); continue; }
      setSync('saving');
      try{
        // optimistic concurrency: if someone else changed this record since we loaded it, do not blindly overwrite
        const remote=await fsGet(q.kind,q.id);
        if(remote && (remote.rev||0)>q.baseRev){
          // conflict: keep the server's version, tell the user, never silently lose either side
          upsertLocal(q.kind,remote); cacheSave();
          queue.shift(); qSave();
          if(typeof onConflict==='function') onConflict(q.kind,local,remote);
          continue;
        }
        await fsSet(q.kind,local);
        queue.shift(); qSave();
      }catch(e){
        setSync('error');
        setTimeout(flushQueue,8000);       // retry later; queue is persisted so nothing is lost
        return;
      }
    }
  }while(flushAgain);
  setSync('synced');
}
function flushQueue(){
  if(flushPromise){ flushAgain=true; return flushPromise; }
  const p=_flushBody().catch(e=>{ setSync('error'); });
  flushPromise=p;
  p.then(()=>{ if(flushPromise===p) flushPromise=null; });
  return p;
}
let onConflict=null;
function setConflictHandler(fn){ onConflict=fn; }

/* Pull everything from the server and merge. A locally-queued (unsent) record always wins over the
   server copy so we never clobber a pending edit with stale data. */
let lastPull=0;
async function pullAll(){
  try{
    const pending=new Set(queue.map(q=>q.kind+':'+q.id));
    for(const k of KINDS){
      const remote=await fsList(k);
      const remoteIds=new Set(remote.map(r=>r.id));
      remote.forEach(r=>{ if(!pending.has(k+':'+r.id)) upsertLocal(k,r); });
      // records we have locally that the server doesn't and aren't pending: leave (could be mid-write)
    }
    cacheSave(); lastPull=Date.now();
    if(!queue.length) setSync('synced');
    return true;
  }catch(e){ setSync('error'); return false; }
}

/* Split editor: rows of partner + percent. Used for both expense split and profit split. */
function splitEditorHTML(prefix,shares,partnerIds){
  const rows=partnerIds.map(pid=>{
    const s=(shares||[]).find(x=>x.pid===pid); const v=s?s.pct:'';
    return `<div class="split-row"><span class="split-name">${esc(pname(pid))}</span><input class="form-input split-in" type="number" step="0.01" min="0" inputmode="decimal" id="${prefix}_${pid}" value="${v}" oninput="updSplitTotal('${prefix}')"><span class="pct">%</span></div>`;
  }).join('');
  return `<div id="${prefix}_box">${rows}<div class="split-total" id="${prefix}_tot"></div></div>`;
}
function readSplit(prefix,partnerIds){ return partnerIds.map(pid=>({pid,pct:Number($(prefix+'_'+pid)?.value||0)})); }
function updSplitTotal(prefix){
  const box=$(prefix+'_box'); if(!box) return;
  const ids=[...box.querySelectorAll('input')].map(i=>i.id.slice(prefix.length+1));
  const t=pctTotal(readSplit(prefix,ids)); const el=$(prefix+'_tot'); if(!el) return;
  const good=Math.abs(t-100)<0.001;
  el.className='split-total '+(good?'ok':'bad'); el.textContent='Total: '+t+'%'+(good?' ✓':' — must be 100%');
}
function equalSplit(prefix){
  const box=$(prefix+'_box'); const ins=[...box.querySelectorAll('input')]; const n=ins.length; if(!n)return;
  let left=10000; ins.forEach((inp,i)=>{ const v=i===n-1?left:Math.floor(10000/n); inp.value=(v/100).toString(); left-=v; }); updSplitTotal(prefix);
}

function linesEditorHTML(prefix,lines,partnerIds){

}
function readLines(prefix,n){ const out=[]; for(let i=0;i<n;i++){ const p=$(prefix+'_p'+i), a=$(prefix+'_a'+i); if(p&&a) out.push({pid:p.value,amount:Number(a.value||0)}); } return out; }
function _lineArr(prefix){ return prefix==='pay'?_payLines:prefix==='rcv'?_recvLines:_contribLines; }
function _setLineArr(prefix,v){ if(prefix==='pay')_payLines=v; else if(prefix==='rcv')_recvLines=v; else _contribLines=v; }
function addLine(prefix){ const cur=readLines(prefix,_lineArr(prefix).length); const ids=(siteById(_formSite)?.partners||[]).map(p=>p.pid); const used=cur.map(l=>l.pid); const next=ids.find(i=>!used.includes(i))||ids[0]; cur.push({pid:next,amount:''}); _setLineArr(prefix,cur); refreshLines(prefix); }
function removeLine(prefix,i){ const cur=readLines(prefix,_lineArr(prefix).length); cur.splice(i,1); _setLineArr(prefix,cur); refreshLines(prefix); }
function refreshLines(prefix){ const ids=(siteById(_formSite)?.partners||[]).map(p=>p.pid); const box=$(prefix+'_wrap'); if(box){ box.innerHTML=linesEditorHTML(prefix,_lineArr(prefix),ids); lineTotals(prefix); } }
function lineTotals(prefix){

}

let _receipt='';
async function pickReceipt(inp){
  const f=inp.files[0]; if(!f) return;
  try{ _receipt=await compressImage(f,900,0.72); $('f_photo_prev').innerHTML=`<img class="rc" src="${_receipt}">`; }catch(e){ toast('Could not read photo'); }
}
function compressImage(file,maxW,q){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(maxW/img.width,maxW/img.height,1); const c=document.createElement('canvas'); c.width=img.width*k; c.height=img.height*k; c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); }; img.onerror=rej; img.src=e.target.result; }; r.onerror=rej; r.readAsDataURL(file); }); }

function saveExpense(siteId,id){

  const old=id?DB.expenses.find(x=>x.id===id):null;
  // `split` = explicit override (only when the box is ticked). `stampedSplit` = the site split in force TODAY,

  const rec={...(old||{id:uid()}),siteId,date,amount,category:$('f_cat').value.trim(),vendor:$('f_vendor').value.trim(),kind:$('f_kind').value,paidBy,note:$('f_note').value.trim(),

  saveRecord('expenses',rec,ME.name); _receipt='';

function onIncomeKind(){ const k=$('f_ikind').value; $('ctb_section').style.display=k==='capital'?'block':'none'; $('rcv_lbl').textContent=k==='capital'?'Now held by':'Received by (whose account / cash)'; $('src_wrap').style.display=k==='booking'?'block':'none'; }
function saveIncome(siteId,id){
  const kind=$('f_ikind').value; const amount=Number($('f_amount').value||0); if(!(amount>0)){toast('Enter the amount');return;}
  const date=$('f_date').value; if(!date){toast('Pick a date');return;}
  const receivedBy=readLines('rcv',_recvLines.length).filter(l=>l.amount>0);
  const v=validateLines(receivedBy,amount,kind==='capital'?'Held by':'Received by'); if(!v.ok){toast(v.msg);return;}
  let contributedBy;
  if(kind==='capital'){ contributedBy=readLines('ctb',_contribLines.length).filter(l=>l.amount>0); const v2=validateLines(contributedBy,amount,'Contributed by'); if(!v2.ok){toast(v2.msg);return;} }
  const old=id?DB.incomes.find(x=>x.id===id):null;
  const rec={...(old||{id:uid()}),siteId,date,amount,kind,source:kind==='booking'?$('f_source').value.trim():'',receivedBy,contributedBy,note:$('f_note').value.trim()};
  saveRecord('incomes',rec,ME.name);
  logAction(ME.name,(old?'Edited':'Added')+' '+kind+' '+inr(toPaise(amount)),siteId);
  closeModal(); render(); toast(old?'Updated':'Saved');
}

/* ---- settle tab ---- */
function siteSettleHTML(s,res){

  return h;
}
function openSettlementForm(siteId,from,to,amount,id){
  const s=siteById(siteId); const ids=s.partners.map(p=>p.pid); const e=id?DB.settlements.find(x=>x.id===id):null;
  const f=e?.from||from||ids[0], t=e?.to||to||ids[1]||ids[0];

    <div class="form-row"><div class="form-group"><label class="form-label">Paid by</label><select class="form-select" id="st_from">${ids.map(i=>`<option value="${i}" ${i===f?'selected':''}>${esc(pname(i))}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Paid to</label><select class="form-select" id="st_to">${ids.map(i=>`<option value="${i}" ${i===t?'selected':''}>${esc(pname(i))}</option>`).join('')}</select></div></div>
    <div class="form-row"><div class="form-group"><label class="form-label">Date</label><input type="date" class="form-input" id="st_date" value="${e?.date||todayStr()}"></div><div class="form-group"><label class="form-label">Amount (₹) *</label><input type="number" step="0.01" class="form-input" id="st_amount" inputmode="decimal" value="${e?.amount||amount||''}"></div></div>

}
function saveSettlement(siteId,id){
  const from=$('st_from').value,to=$('st_to').value,amount=Number($('st_amount').value||0);
  if(from===to){toast('Payer and receiver must be different');return;} if(!(amount>0)){toast('Enter the amount');return;}
  const old=id?DB.settlements.find(x=>x.id===id):null;
  saveRecord('settlements',{...(old||{id:uid()}),siteId,from,to,amount,date:$('st_date').value,note:$('st_note').value.trim()},ME.name);
  logAction(ME.name,'Settlement '+pname(from)+' → '+pname(to)+' '+inr(toPaise(amount)),siteId);
  closeModal(); render(); toast('Recorded');
}

/* ---- per-site report tab (inside a site) ---- */
let _repFrom='', _repTo='';
function siteReportHTML(s,_res){
  const res=computeSite(s,expensesOf(s.id),incomesOf(s.id),settlementsOf(s.id),{from:_repFrom,to:_repTo});
  const cls=res.profit>0?'g':res.profit<0?'r':'';
  let h=`<div class="filters"><input type="date" class="form-input" value="${_repFrom}" onchange="_repFrom=this.value;render()"><span>to</span><input type="date" class="form-input" value="${_repTo}" onchange="_repTo=this.value;render()">${_repFrom||_repTo?`<button class="mini-btn del" onclick="_repFrom='';_repTo='';render()">Clear</button>`:''}</div>`;
  h+=`<div class="card"><div class="kv"><span>Total income</span><b class="g">${inr(res.totalInc)}</b></div>
    <div class="kv"><span>Running costs</span><b class="r">${inr(res.totalRunExp)}</b></div>
    <div class="kv"><span>Setup / one-time costs</span><b class="r">${inr(res.totalSetupExp)}</b></div>
    ${res.totalRefund?`<div class="kv"><span>Refunds received</span><b class="g">${inr(res.totalRefund)}</b></div>`:''}
    <div class="kv total"><span>${res.profit<0?'Net loss':'Net profit'}</span><b class="${cls}">${inr(res.profit,{plus:true})}</b></div>
    <div class="kv"><span>Profit before setup costs</span><b class="${res.runningProfit>=0?'g':'r'}">${inr(res.runningProfit,{plus:true})}</b></div>
    ${res.totalCapital?`<div class="kv"><span>Partner capital put in</span><b class="b">${inr(res.totalCapital)}</b></div>`:''}</div>`;

  // partner table
  h+=`<div class="sec-hdr">Partner-wise</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Partner</th><th>Share</th><th>Paid out</th><th>Collected</th><th>Profit share</th><th>Net</th></tr></thead><tbody>`+
    Object.values(res.partners).map(p=>{
      const sp=(s.profitSplit||[]).find(x=>x.pid===p.pid);
      return `<tr><td><b>${esc(pname(p.pid))}</b></td><td>${sp?sp.pct+'%':'—'}</td><td>${inr(p.paidOut)}</td><td>${inr(p.revHeld)}</td><td class="${(res.profitParts[p.pid]||0)>=0?'g':'r'}">${inr(res.profitParts[p.pid]||0,{plus:true})}</td><td class="${p.net>0?'g':p.net<0?'r':''}"><b>${p.net===0?'settled':(p.net>0?'gets ':'owes ')+inr(Math.abs(p.net))}</b></td></tr>`;
    }).join('')+`</tbody></table></div>`;

  // category
  const cats=Object.entries(res.byCategory).sort((a,b)=>b[1]-a[1]);
  if(cats.length){ const tot=cats.reduce((a,c)=>a+c[1],0);
    h+=`<div class="sec-hdr">Where the money went</div><div class="card">`+cats.map(([c,v])=>`<div class="bar-row"><div class="bar-top"><span>${esc(c)}</span><b>${inr(v)} <small>${Math.round(v/tot*100)}%</small></b></div><div class="bar"><i style="width:${Math.max(2,v/tot*100)}%"></i></div></div>`).join('')+`</div>`; }

  // monthly
  if(res.byMonth.length){
    h+=`<div class="sec-hdr">Month by month</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Profit / Loss</th></tr></thead><tbody>`+
    res.byMonth.map(m=>{const p=m.inc-m.exp; return `<tr><td><b>${monthLabel(m.month)}</b></td><td class="g">${inr(m.inc)}</td><td class="r">${inr(m.exp)}</td><td class="${p>=0?'g':'r'}"><b>${inr(p,{plus:true})}</b></td></tr>`;}).join('')+`</tbody></table></div>`;
  }

  return h;
}

/* ---- top-level Reports tab ---- */
let REP='month', REP_YEAR=new Date().getFullYear(), REP_PARTNER='';
function viewReports(){
  const tabs=[['month','Monthly P&L'],['site','Site-wise'],['partner','Partner']];
  let h=`<div class="tabs">${tabs.map(([k,l])=>`<div class="tab ${REP===k?'on':''}" onclick="REP='${k}';render()">${l}</div>`).join('')}</div>`;
  if(!siteList().length) return h+`<div class="empty"><div class="emo">📊</div><p>Add a site and some entries to see reports.</p></div>`;
  if(REP==='month') h+=repMonthly(); else if(REP==='site') h+=repSites(); else h+=repPartner();
  return h;
}

/* Overall monthly P&L: every site combined, month by month, with a site breakdown per month */
function repMonthly(){
  const sites=siteList();
  const years=new Set([new Date().getFullYear()]);
  DB.expenses.concat(DB.incomes).forEach(x=>{ if(!x.deleted&&x.date) years.add(+x.date.slice(0,4)); });
  const ys=[...years].sort();
  let h=`<div class="filters"><select class="form-select" onchange="REP_YEAR=+this.value;render()">${ys.map(y=>`<option ${y===REP_YEAR?'selected':''}>${y}</option>`).join('')}</select></div>`;
  const o=overallForRange(REP_YEAR+'-01-01',REP_YEAR+'-12-31');
  const months=o.byMonth;
  const totInc=months.reduce((a,m)=>a+m.inc,0), totExp=months.reduce((a,m)=>a+m.exp,0), totProfit=totInc-totExp;
  h+=`<div class="card"><div class="kv"><span>Income ${REP_YEAR}</span><b class="g">${inr(totInc)}</b></div><div class="kv"><span>Expenses ${REP_YEAR}</span><b class="r">${inr(totExp)}</b></div><div class="kv total"><span>${totProfit<0?'Loss':'Profit'} ${REP_YEAR}</span><b class="${totProfit>=0?'g':'r'}">${inr(totProfit,{plus:true})}</b></div></div>`;
  if(!months.length) return h+`<div class="empty"><p>No entries in ${REP_YEAR}.</p></div>`;
  // bar chart
  const max=Math.max(...months.map(m=>Math.max(m.inc,m.exp)),1);
  h+=`<div class="sec-hdr">Income vs Expenses</div><div class="card"><div class="chart">`+months.map(m=>`<div class="ccol"><div class="cbars"><i class="ci" style="height:${m.inc/max*100}%"></i><i class="ce" style="height:${m.exp/max*100}%"></i></div><div class="clbl">${monthLabel(m.month).slice(0,3)}</div></div>`).join('')+`</div><div class="legend"><span><i class="ci"></i>Income</span><span><i class="ce"></i>Expenses</span></div></div>`;
  h+=`<div class="sec-hdr">Month by month</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Profit / Loss</th></tr></thead><tbody>`+
    months.map(m=>{const p=m.inc-m.exp; return `<tr onclick="REP_MONTH='${m.month}';openMonthDetail('${m.month}')" style="cursor:pointer"><td><b>${monthLabel(m.month)}</b></td><td class="g">${inr(m.inc)}</td><td class="r">${inr(m.exp)}</td><td class="${p>=0?'g':'r'}"><b>${inr(p,{plus:true})}</b></td></tr>`;}).join('')+
    `<tr class="totrow"><td><b>Total</b></td><td class="g"><b>${inr(totInc)}</b></td><td class="r"><b>${inr(totExp)}</b></td><td class="${totProfit>=0?'g':'r'}"><b>${inr(totProfit,{plus:true})}</b></td></tr></tbody></table></div><div class="muted" style="margin:6px 2px">Tap a month to see it site by site.</div>`;
  h+=`<div class="btn-row"><button class="site-btn share" onclick="exportOverallPDF()">📄 PDF</button><button class="site-btn pay" onclick="exportXLSX('all')">📊 Excel</button></div>`;
  return h;
}
let REP_MONTH='';
function openMonthDetail(m){
  const rows=siteList().map(s=>{ const r=computeSite(s,expensesOf(s.id),incomesOf(s.id),settlementsOf(s.id),{from:m+'-01',to:m+'-31'}); const p=r.totalInc-r.totalExp; return {s,inc:r.totalInc,exp:r.totalExp,p}; }).filter(x=>x.inc||x.exp);
  const ti=rows.reduce((a,x)=>a+x.inc,0), te=rows.reduce((a,x)=>a+x.exp,0);

    rows.map(x=>`<tr><td><b>${esc(x.s.name)}</b></td><td class="g">${inr(x.inc)}</td><td class="r">${inr(x.exp)}</td><td class="${x.p>=0?'g':'r'}"><b>${inr(x.p,{plus:true})}</b></td></tr>`).join('')+
    `<tr class="totrow"><td><b>Total</b></td><td class="g"><b>${inr(ti)}</b></td><td class="r"><b>${inr(te)}</b></td><td class="${ti-te>=0?'g':'r'}"><b>${inr(ti-te,{plus:true})}</b></td></tr></tbody></table></div><button class="cancel-btn" onclick="closeModal()">Close</button>`);

/* Site-wise P&L: one row per site, sortable, date range */
let SITE_SORT='profit';
function repSites(){
  let h=`<div class="filters"><input type="date" class="form-input" value="${_repFrom}" onchange="_repFrom=this.value;render()"><span>to</span><input type="date" class="form-input" value="${_repTo}" onchange="_repTo=this.value;render()">${_repFrom||_repTo?`<button class="mini-btn del" onclick="_repFrom='';_repTo='';render()">Clear</button>`:''}</div>`;

  rows.sort((a,b)=>SITE_SORT==='name'?a.site.name.localeCompare(b.site.name):SITE_SORT==='income'?b.res.totalInc-a.res.totalInc:SITE_SORT==='exp'?b.res.totalExp-a.res.totalExp:b.res.profit-a.res.profit);
  h+=`<div class="card"><div class="kv"><span>Total income</span><b class="g">${inr(o.totalInc)}</b></div><div class="kv"><span>Total expenses</span><b class="r">${inr(o.totalExp)}</b></div><div class="kv total"><span>${o.profit<0?'Overall loss':'Overall profit'}</span><b class="${o.profit>=0?'g':'r'}">${inr(o.profit,{plus:true})}</b></div></div>`;
  h+=`<div class="filters" style="margin-top:8px"><span>Sort:</span><select class="form-select" onchange="SITE_SORT=this.value;render()"><option value="profit" ${SITE_SORT==='profit'?'selected':''}>Profit (high → low)</option><option value="income" ${SITE_SORT==='income'?'selected':''}>Income</option><option value="exp" ${SITE_SORT==='exp'?'selected':''}>Expenses</option><option value="name" ${SITE_SORT==='name'?'selected':''}>Name</option></select></div>`;
  h+=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Site</th><th>Income</th><th>Expenses</th><th>Profit / Loss</th></tr></thead><tbody>`+
    rows.map(({site,res})=>`<tr onclick="openSite('${site.id}','rep')" style="cursor:pointer"><td><b>${esc(site.name)}</b><div class="muted">${esc(site.status||'Active')}</div></td><td class="g">${inr(res.totalInc)}</td><td class="r">${inr(res.totalExp)}</td><td class="${res.profit>=0?'g':'r'}"><b>${inr(res.profit,{plus:true})}</b></td></tr>`).join('')+
    `<tr class="totrow"><td><b>Total</b></td><td class="g"><b>${inr(o.totalInc)}</b></td><td class="r"><b>${inr(o.totalExp)}</b></td><td class="${o.profit>=0?'g':'r'}"><b>${inr(o.profit,{plus:true})}</b></td></tr></tbody></table></div>`;
  h+=`<div class="btn-row"><button class="site-btn share" onclick="exportOverallPDF()">📄 PDF</button><button class="site-btn pay" onclick="exportXLSX('all')">📊 Excel</button></div>`;
  return h;
}

/* Partner statement: across all sites, what this partner paid, collected, is owed */
function repPartner(){
  const ps=partnerList(); if(!REP_PARTNER||!ps.find(p=>p.id===REP_PARTNER)) REP_PARTNER=(ps.find(p=>p.name===ME.name)||ps[0]||{}).id||'';
  let h=`<div class="filters"><select class="form-select" onchange="REP_PARTNER=this.value;render()">${ps.map(p=>`<option value="${p.id}" ${p.id===REP_PARTNER?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`;
  const o=overallForRange('','');
  const rows=o.per.filter(({res})=>res.partners[REP_PARTNER]).map(({site,res})=>({site,res,p:res.partners[REP_PARTNER],share:res.profitParts[REP_PARTNER]||0}));
  if(!rows.length) return h+`<div class="empty"><p>${esc(pname(REP_PARTNER))} isn't on any site yet.</p></div>`;
  const tot=(f)=>rows.reduce((a,r)=>a+f(r),0);
  const net=tot(r=>r.p.net);
  h+=`<div class="hero small"><div class="hero-lbl">${esc(pname(REP_PARTNER))} · all sites</div><div class="hero-val ${net>0?'g':net<0?'r':''}">${net===0?'Settled':(net>0?'Is owed ':'Owes ')+inr(Math.abs(net))}</div>
    <div class="hero-row"><div><b>${inr(tot(r=>r.p.paidOut))}</b><span>Paid out</span></div><div><b>${inr(tot(r=>r.p.revHeld))}</b><span>Collected</span></div><div><b>${inr(tot(r=>r.share),{plus:true})}</b><span>Profit share</span></div></div></div>`;
  h+=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Site</th><th>Paid</th><th>Collected</th><th>Profit share</th><th>Net</th></tr></thead><tbody>`+
    rows.map(r=>`<tr onclick="openSite('${r.site.id}','settle')" style="cursor:pointer"><td><b>${esc(r.site.name)}</b></td><td>${inr(r.p.paidOut)}</td><td>${inr(r.p.revHeld)}</td><td class="${r.share>=0?'g':'r'}">${inr(r.share,{plus:true})}</td><td class="${r.p.net>0?'g':r.p.net<0?'r':''}"><b>${r.p.net===0?'settled':inr(r.p.net,{plus:true})}</b></td></tr>`).join('')+`</tbody></table></div>`;
  if(o.transfers.length) h+=`<div class="sec-hdr">Overall settlement (all sites)</div><div class="card">`+o.transfers.map(t=>`<div class="tr-row"><span><b>${esc(pname(t.from))}</b> pays <b>${esc(pname(t.to))}</b></span><span class="amt">${inr(t.amount)}</span></div>`).join('')+`</div>`;
  return h;
}

function viewLog(){
  const rows=DB.log.slice().sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,200);
  let h=`<div class="sec-hdr">Recent activity</div>`;
  if(!rows.length) return h+`<div class="empty"><p>Nothing yet.</p></div>`;
  return h+rows.map(l=>{ const d=new Date(l.at||0); const ts=d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); const s=l.siteId?siteById(l.siteId):null;
    return `<div class="entry"><div class="entry-l"><div class="entry-t">${esc(l.text)}</div><div class="entry-s"><b>${esc(l.who)}</b> · ${ts}${s?' · '+esc(s.name):''}</div></div></div>`; }).join('');
}

function pdfMoney(paise){ const n=Math.round(Math.abs(paise)/100); const s=String(n); const l3=s.slice(-3), r=s.slice(0,-3); return (paise<0?'-':'')+'Rs. '+(r?r.replace(/\B(?=(\d{2})+(?!\d))/g,',')+',':'')+l3; }
function fmtDPdf(d){ return fmtDate(d).replace(/ /g,'-'); }

function makePDF(sitesToShow,title,from,to){

    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...DARK);doc.text('Site-wise',ML,y);y+=2;y=hr(y,O);y+=3;
    doc.setFillColor(...O);doc.rect(ML,y-1,CW,7,'F');doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...WHITE);doc.text('Site',ML+1,y+4);doc.text('Income',ML+95,y+4,{align:'right'});doc.text('Expenses',ML+135,y+4,{align:'right'});doc.text('Profit / Loss',MR-1,y+4,{align:'right'});y+=9;
    let alt=false; o.per.forEach(({site,res})=>{ y=checkY(y,8); if(alt){doc.setFillColor(...LIGHT);doc.rect(ML,y-1,CW,7,'F');} alt=!alt; doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...DARK);doc.text(doc.splitTextToSize(site.name,70)[0],ML+1,y+4);doc.setTextColor(...GREEN);doc.text(pdfMoney(res.totalInc),ML+95,y+4,{align:'right'});doc.setTextColor(...RED);doc.text(pdfMoney(res.totalExp),ML+135,y+4,{align:'right'});doc.setFont('helvetica','bold');doc.setTextColor(...(res.profit>=0?GREEN:RED));doc.text(pdfMoney(res.profit),MR-1,y+4,{align:'right'});y+=7; });
    // monthly
    if(o.byMonth.length){ y=checkY(y,30); y+=6; doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...DARK);doc.text('Month by month',ML,y);y+=2;y=hr(y,O);y+=3;
      doc.setFillColor(...O);doc.rect(ML,y-1,CW,7,'F');doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...WHITE);doc.text('Month',ML+1,y+4);doc.text('Income',ML+95,y+4,{align:'right'});doc.text('Expenses',ML+135,y+4,{align:'right'});doc.text('Profit / Loss',MR-1,y+4,{align:'right'});y+=9;
      alt=false; o.byMonth.forEach(m=>{ y=checkY(y,8); if(alt){doc.setFillColor(...LIGHT);doc.rect(ML,y-1,CW,7,'F');} alt=!alt; const p=m.inc-m.exp; doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...DARK);doc.text(monthLabel(m.month),ML+1,y+4);doc.setTextColor(...GREEN);doc.text(pdfMoney(m.inc),ML+95,y+4,{align:'right'});doc.setTextColor(...RED);doc.text(pdfMoney(m.exp),ML+135,y+4,{align:'right'});doc.setFont('helvetica','bold');doc.setTextColor(...(p>=0?GREEN:RED));doc.text(pdfMoney(p),MR-1,y+4,{align:'right'});y+=7; }); }

    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...MUT);doc.text((site.address?site.address+'  |  ':'')+period,ML,y);y+=7;y=hr(y);y+=3;
    const bw=CW/4-2;
    [['INCOME',res.totalInc,GREEN],['EXPENSES',res.totalExp,RED],[res.profit<0?'LOSS':'PROFIT',res.profit,res.profit>=0?GREEN:RED],['SETUP COST',res.totalSetupExp,O]].forEach(([l,v,c],i)=>{ const bx=ML+i*(bw+2.7); doc.setLineWidth(0.25);doc.setDrawColor(...BDR);doc.setFillColor(...LIGHT);doc.rect(bx,y,bw,20,'FD');doc.setDrawColor(...c);doc.setLineWidth(1.2);doc.line(bx,y,bx+bw,y);doc.setLineWidth(0.25);doc.setFont('helvetica','bold');doc.setFontSize(6);doc.setTextColor(...MUT);doc.text(l,bx+bw/2,y+6,{align:'center'});doc.setFontSize(v>=100000000?7:9);doc.setTextColor(...c);doc.text(pdfMoney(v),bx+bw/2,y+14,{align:'center'}); }); y+=27;

    // partner table
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...DARK);doc.text('Partners — who paid, who owes',ML,y);y+=2;y=hr(y,O);y+=3;
    doc.setFillColor(...O);doc.rect(ML,y-1,CW,7,'F');doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(...WHITE);
    doc.text('Partner',ML+1,y+4);doc.text('Profit %',ML+50,y+4,{align:'right'});doc.text('Paid out',ML+80,y+4,{align:'right'});doc.text('Collected',ML+110,y+4,{align:'right'});doc.text('Profit share',ML+142,y+4,{align:'right'});doc.text('Net',MR-1,y+4,{align:'right'});y+=9;
    let alt=false; Object.values(res.partners).forEach(p=>{ y=checkY(y,8); if(alt){doc.setFillColor(...LIGHT);doc.rect(ML,y-1,CW,7,'F');} alt=!alt; const sp=(site.profitSplit||[]).find(x=>x.pid===p.pid); const ps=res.profitParts[p.pid]||0;
      doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...DARK);doc.text(pname(p.pid),ML+1,y+4);

      doc.setTextColor(...(ps>=0?GREEN:RED));doc.text(pdfMoney(ps),ML+142,y+4,{align:'right'});
      doc.setFont('helvetica','bold');doc.setTextColor(...(p.net>0?GREEN:p.net<0?RED:MUT));doc.text(p.net===0?'Settled':(p.net>0?'Gets ':'Owes ')+pdfMoney(Math.abs(p.net)),MR-1,y+4,{align:'right'});y+=7; });
    const tr=settleUp(Object.fromEntries(Object.values(res.partners).map(p=>[p.pid,p.net])));
    if(tr.length){ y+=3; doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...DARK);doc.text('To settle:',ML+1,y);y+=5; tr.forEach(t=>{ y=checkY(y,6); doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text(pname(t.from)+'  pays  '+pname(t.to)+'   '+pdfMoney(t.amount),ML+4,y);y+=5; }); }
    y+=4;

    // ledger
    y=checkY(y,25); doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...DARK);doc.text('Complete Ledger',ML,y);y+=2;y=hr(y,O);y+=3;
    doc.setFillColor(...O);doc.rect(ML,y-1,CW,7,'F');doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...WHITE);doc.text('Date',ML+1,y+4);doc.text('Type',ML+24,y+4);doc.text('Description',ML+44,y+4);doc.text('Amount',MR-1,y+4,{align:'right'});y+=9;

      ...incomesOf(site.id).filter(e=>inR(e.date)).map(e=>({d:e.date,t:e.kind==='capital'?'CAPITAL':e.kind==='refund'?'REFUND':'INCOME',amt:e.amount,desc:[e.note,e.source,(e.kind==='capital'?'from '+(e.contributedBy||[]).map(l=>pname(l.pid)).join('+')+' to be held by ':'recd by ')+(e.receivedBy||[]).map(l=>pname(l.pid)).join('+')].filter(Boolean).join(' · '),c:GREEN})),
      ...settlementsOf(site.id).filter(e=>inR(e.date)).map(e=>({d:e.date,t:'SETTLE',amt:e.amount,desc:pname(e.from)+' paid '+pname(e.to)+(e.note?' · '+e.note:''),c:[43,110,240]}))].sort((a,b)=>a.d.localeCompare(b.d));

  });
  return doc;
}
async function shareOrSave(doc,name){
  const blob=doc.output('blob'); const file=new File([blob],name,{type:'application/pdf'});
  try{ if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({title:name,files:[file]}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);
}
async function exportSitePDF(id){ const s=siteById(id); const doc=makePDF([s],'Site Ledger Report',_repFrom,_repTo); if(doc) await shareOrSave(doc,'Ledger_'+s.name.replace(/[^a-z0-9]+/gi,'_')+'.pdf'); }

function exportXLSX(which){
  if(!window.XLSX){ alert('Excel library did not load. Check your internet connection and try again.'); return; }
  const sites=which==='all'?siteList():[siteById(which)];
  const wb=XLSX.utils.book_new();
  const summary=[['Site','Income','Expenses','Setup cost','Profit / Loss']];
  sites.forEach(s=>{ const r=computeSite(s,expensesOf(s.id),incomesOf(s.id),settlementsOf(s.id),{from:_repFrom,to:_repTo}); summary.push([s.name,r.totalInc/100,r.totalExp/100,r.totalSetupExp/100,r.profit/100]); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(summary),'Summary');
  const ledger=[['Site','Date','Type','Category / Source','Vendor','Note','Amount','Paid / Received by','Custom split']];
  sites.forEach(s=>{
    expensesOf(s.id).forEach(e=>ledger.push([s.name,e.date,e.kind==='setup'?'Setup expense':'Expense',e.category||'',e.vendor||'',e.note||'',e.amount,(e.paidBy||[]).map(l=>pname(l.pid)+' '+l.amount).join(' + '),e.split&&e.split.length?e.split.map(x=>pname(x.pid)+' '+x.pct+'%').join(', '):'']));
    incomesOf(s.id).forEach(e=>ledger.push([s.name,e.date,e.kind==='capital'?'Capital':e.kind==='refund'?'Refund':'Income',e.source||'','',e.note||'',e.amount,(e.receivedBy||[]).map(l=>pname(l.pid)+' '+l.amount).join(' + '),'']));
    settlementsOf(s.id).forEach(e=>ledger.push([s.name,e.date,'Settlement','','',e.note||'',e.amount,pname(e.from)+' → '+pname(e.to),'']));
  });
  ledger.sort((a,b)=>(typeof a[1]==='string'&&typeof b[1]==='string')?a[1].localeCompare(b[1]):0);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ledger),'Ledger');
  const months=[['Month','Income','Expenses','Profit / Loss']];
  const eb={},ib={},sb={}; sites.forEach(s=>{eb[s.id]=expensesOf(s.id);ib[s.id]=incomesOf(s.id);sb[s.id]=settlementsOf(s.id);});
  computeOverall(sites,eb,ib,sb,{from:_repFrom,to:_repTo}).byMonth.forEach(m=>months.push([monthLabel(m.month),m.inc/100,m.exp/100,(m.inc-m.exp)/100]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(months),'Monthly');
  const pt=[['Site','Partner','Paid out','Collected','Profit share','Net (+ is owed)']];
  sites.forEach(s=>{ const r=computeSite(s,expensesOf(s.id),incomesOf(s.id),settlementsOf(s.id),{from:_repFrom,to:_repTo}); Object.values(r.partners).forEach(p=>pt.push([s.name,pname(p.pid),p.paidOut/100,p.revHeld/100,(r.profitParts[p.pid]||0)/100,p.net/100])); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(pt),'Partners');
  XLSX.writeFile(wb,'SiteBooks_'+(which==='all'?'All':sites[0].name.replace(/[^a-z0-9]+/gi,'_'))+'_'+todayStr()+'.xlsx');
}
